# A stand-in for IPAM's IPClaim. IPAM serves the real kind from its own
# aggregated API server. Envtest and the Redfish lab's synchronized DHCP mode
# have none, so this CRD keeps only the fields Fleet reads. No deployment
# bundle includes it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipclaims.ipam.miloapis.com
spec:
  group: ipam.miloapis.com
  names: {kind: IPClaim, listKind: IPClaimList, plural: ipclaims, singular: ipclaim}
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
          status: {type: object, x-kubernetes-preserve-unknown-fields: true}
