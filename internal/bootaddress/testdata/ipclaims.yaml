# Stand-ins for IPAM's IPClaim and IPAllocation. IPAM serves the real kinds
# from its own aggregated API server. Envtest and the Redfish lab's
# synchronized DHCP mode have none, so these CRDs keep only the fields Fleet
# reads. No deployment
# bundle includes it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipclaims.ipam.miloapis.com
spec:
  group: ipam.miloapis.com
  names: {kind: IPClaim, listKind: IPClaimList, plural: ipclaims, singular: ipclaim}
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
          status: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
# A stand-in for IPAM's IPAllocation, which Fleet lists to confirm that a
# released claim's address is no longer allocated.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipallocations.ipam.miloapis.com
spec:
  group: ipam.miloapis.com
  names: {kind: IPAllocation, listKind: IPAllocationList, plural: ipallocations, singular: ipallocation}
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
          status: {type: object, x-kubernetes-preserve-unknown-fields: true}
