# pnpm settings for this plugin. It is a single package with its own lockfile,
# not a workspace member, so there is no `packages:` list.

# Wait a day after a release before installing it, and refuse a version
# whose provenance or trusted publisher is weaker than an earlier release's.
minimumReleaseAge: 1440
trustPolicy: no-downgrade

# Our own packages are published and consumed across repos on the same day, so
# the one-day release delay must not hold them back.
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# esbuild checks its platform binary on install. The image installs with
# --ignore-scripts.
allowBuilds:
  esbuild: true
  fsevents: false

# @tanstack/react-table ships agent skills, and pnpm 12 asks before exposing
# them. Deny them: the org decided no package's skills should run.
permissions:
  '@tanstack/react-table':
    skills: false

# Carried over from package.json's npm overrides.
overrides:
  '@module-federation/dts-plugin>adm-zip': 0.6.1
  '@module-federation/dts-plugin>undici': 7.30.1
  # 6.3.1, which @babel/core pulls in, was published without provenance after
  # earlier semver releases had it, so trustPolicy rejects it. 6.3.2 has it.
  semver@6: ^6.3.2
