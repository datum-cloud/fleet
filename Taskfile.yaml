version: '3'

tasks:
  standalone:test:
    desc: Run the synthetic lifecycle in a disposable local kind cluster.
    cmds:
      - ./hack/run-standalone-smoke.sh

  multiplane:acceptance:
    desc: Fresh local Milo/Karmada/kro/PXE acceptance, every service installed by per-cluster Flux from the checkout, in the task-owned Colima profile (exit 0 pass, 1 fail, 2 preflight, 3 blocked, 4 timeout).
    env:
      # Explicit opt-in for the documented reversible inotify adjustment inside the task VM only.
      FLEET_MULTIPLANE_INOTIFY: '1024'
    cmds:
      - ./hack/multiplane/run.sh {{.CLI_ARGS}}

  multiplane:redfish-acceptance:
    desc: "The multi-plane acceptance in Redfish mode: workers drive two persistent lab VMs only through the DMTF Redfish Interface Emulator and its lab adapter (same exit codes)."
    env:
      FLEET_MULTIPLANE_INOTIFY: '1024'
    cmds:
      - ./hack/multiplane/run.sh --redfish {{.CLI_ARGS}}

  multiplane:flux-qualification:
    desc: "The Flux qualification suite: the same fresh topology and Flux bootstrap, one completed installation, then the GitOps behavior scenarios (graph lifecycle, drift, restart, fail-closed, retention) the acceptance runs no longer repeat (same exit codes)."
    env:
      FLEET_MULTIPLANE_INOTIFY: '1024'
    cmds:
      - ./hack/multiplane/run.sh --suite flux-qualification {{.CLI_ARGS}}

  multiplane:preflight:
    desc: Check local prerequisites and implementation readiness without creating resources.
    env:
      FLEET_MULTIPLANE_INOTIFY: '1024'
    cmds:
      - ./hack/multiplane/run.sh --preflight-only {{.CLI_ARGS}}

  multiplane:stop:
    desc: Stop (never delete) one retained run's exact containers; custody stays Unknown.
    requires:
      vars: [STATE]
    cmds:
      - ./hack/multiplane/stop.sh "{{.STATE}}"

  multiplane:test-harness:
    desc: Offline tests for the multi-plane harness with fake runtime tools.
    cmds:
      - ./hack/multiplane/test-harness.sh

  manifests:validate:
    desc: Render and validate the production Fleet and Milo manifest roots.
    cmds:
      - kustomize build config/milo >/dev/null
      - kustomize build config/overlays/management-plane >/dev/null
      - ./hack/validate-overlay-isolation.sh

  test:envtest:
    desc: Run every test, including the multi-project envtest end-to-end test.
    cmds:
      - KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2 use 1.37.0 -p path)" go test -race ./...

  milo:validate:
    desc: Validate the non-effectful Milo acceptance packaging.
    cmds:
      - go test ./test/acceptance/milo/...
      - go run ./test/acceptance/milo/cmd validate --root .

  milo:test:fail-closed:
    desc: Prove missing production integrations cannot become acceptance success.
    cmds:
      - go test -race ./test/acceptance/milo/...

  milo:test:live:
    desc: Run protected live preflight; currently exits Blocked before cluster access.
    requires:
      vars: [MILO_ACCEPTANCE_CONFIG, MILO_ACCEPTANCE_OUTPUT]
    env:
      FLEET_MILO_ACCEPTANCE_CONFIG: '{{.MILO_ACCEPTANCE_CONFIG}}'
      FLEET_MILO_ACCEPTANCE_OUTPUT: '{{.MILO_ACCEPTANCE_OUTPUT}}'
    cmds:
      - go run ./test/acceptance/milo/cmd live --config "$FLEET_MILO_ACCEPTANCE_CONFIG" --output "$FLEET_MILO_ACCEPTANCE_OUTPUT"
