apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-request-resolver
  namespace: fleet-system
  labels:
    app.kubernetes.io/name: fleet-request-resolver
    app.kubernetes.io/component: controller
spec:
  # Every replica engages every consumer project; only the lease holder
  # writes. A second replica is a warm standby.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-request-resolver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-request-resolver
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: fleet-request-resolver
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resolver
          image: ghcr.io/datum-cloud/fleet-request-resolver:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/fleet/request-resolver/config/config.yaml
            - --leader-elect=true
            - --leader-election-namespace=fleet-system
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          # Ready only after project discovery has synced, every consuming
          # project is engaged, and every engaged project cache has synced.
          # Readiness never depends on lifecycle integrations.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/fleet/request-resolver/config
              readOnly: true
            - name: discovery-kubeconfig
              mountPath: /etc/fleet/request-resolver/discovery
              readOnly: true
            - name: project-kubeconfig
              mountPath: /etc/fleet/request-resolver/projects
              readOnly: true
      # All three inputs are environment-owned and deliberately absent from
      # this bundle. A missing input keeps the Pod from starting.
      volumes:
        - name: config
          configMap:
            name: fleet-request-resolver-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: discovery-kubeconfig
          secret:
            secretName: fleet-request-resolver-discovery-kubeconfig
            defaultMode: 0440
            items:
              - key: kubeconfig
                path: kubeconfig
        - name: project-kubeconfig
          secret:
            secretName: fleet-request-resolver-project-kubeconfig
            defaultMode: 0440
            items:
              - key: kubeconfig
                path: kubeconfig
