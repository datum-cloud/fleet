apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: metal.datumapis.com-controller
  annotations:
    kubernetes.io/display-name: Fleet Controller
    kubernetes.io/description: Internal Fleet status and retained-record authority
spec:
  launchStage: Alpha
  inheritedRoles:
    - name: metal.datumapis.com-provider
    - name: metal.datumapis.com-consumer
  includedPermissions:
    - metal.datumapis.com/machineclasses.updateStatus
    - metal.datumapis.com/machineprofiles.updateStatus
    - metal.datumapis.com/machinecapacities.updateStatus
    - metal.datumapis.com/machines.updateStatus
    - metal.datumapis.com/machineallocations.list
    - metal.datumapis.com/machineallocations.get
    - metal.datumapis.com/machineallocations.watch
    - metal.datumapis.com/machineallocations.create
    - metal.datumapis.com/machineallocations.update
    - metal.datumapis.com/machineallocations.patch
    - metal.datumapis.com/machineallocations.updateStatus
    - metal.datumapis.com/installations.updateStatus
