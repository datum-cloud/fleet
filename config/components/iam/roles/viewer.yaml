apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: metal.datumapis.com-viewer
  annotations:
    kubernetes.io/display-name: Fleet Viewer
    kubernetes.io/description: View project-local Fleet offerings and allocation results
spec:
  launchStage: Alpha
  includedPermissions:
    - metal.datumapis.com/machineclasses.list
    - metal.datumapis.com/machineclasses.get
    - metal.datumapis.com/machineclasses.watch
    - metal.datumapis.com/machineprofiles.list
    - metal.datumapis.com/machineprofiles.get
    - metal.datumapis.com/machineprofiles.watch
    - metal.datumapis.com/machines.list
    - metal.datumapis.com/machines.get
    - metal.datumapis.com/machines.watch
    - metal.datumapis.com/installations.list
    - metal.datumapis.com/installations.get
    - metal.datumapis.com/installations.watch
