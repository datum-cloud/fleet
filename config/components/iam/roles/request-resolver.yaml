apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: metal.datumapis.com-request-resolver
  annotations:
    kubernetes.io/display-name: Fleet Request Resolver
    kubernetes.io/description: Pin requested hardware on Machines in projects that consume Bare Metal
spec:
  launchStage: Alpha
  # Reads a Machine and its MachineProfile and writes only Machine status.
  # Deliberately excludes Machine spec writes, allocations, capacities,
  # installations, and every lifecycle permission in the controller role.
  includedPermissions:
    - metal.datumapis.com/machines.get
    - metal.datumapis.com/machines.list
    - metal.datumapis.com/machines.watch
    - metal.datumapis.com/machines.updateStatus
    - metal.datumapis.com/machineprofiles.get
    - metal.datumapis.com/machineprofiles.list
    - metal.datumapis.com/machineprofiles.watch
---
apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: metal.datumapis.com-request-resolver-discovery
  annotations:
    kubernetes.io/display-name: Fleet Request Resolver Discovery
    kubernetes.io/description: Discover which projects consume Bare Metal
spec:
  launchStage: Alpha
  # The service catalog consumer provider lists Services at the root to
  # resolve the canonical service name, and lists and watches
  # ServiceConsumers in the provider project. It never writes them: the
  # resolver declares no teardown, so no finalizer is added.
  includedPermissions:
    - services.miloapis.com/services.list
    - services.miloapis.com/serviceconsumers.list
    - services.miloapis.com/serviceconsumers.watch
