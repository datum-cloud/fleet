apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: fleet.datumapis.com-device-power-dispatcher
  annotations:
    kubernetes.io/display-name: Fleet Device Power Dispatcher
    kubernetes.io/description: Accept or refuse power operations, and write only their status
spec:
  launchStage: Alpha
  # Reads what acceptance checks need and writes operation status. It cannot
  # create, change or delete an operation, and cannot write a Device.
  includedPermissions:
    - fleet.datumapis.com/devicepoweroperations.get
    - fleet.datumapis.com/devicepoweroperations.list
    - fleet.datumapis.com/devicepoweroperations.watch
    - fleet.datumapis.com/devicepoweroperations.updateStatus
    - fleet.datumapis.com/devicepoweroperations/status.update
    - fleet.datumapis.com/devicepoweroperations/status.patch
    - fleet.datumapis.com/devices.get
    - fleet.datumapis.com/devices.list
    - fleet.datumapis.com/devices.watch
    - metal.datumapis.com/machinecapacities.get
    - metal.datumapis.com/machinecapacities.list
    - metal.datumapis.com/machinecapacities.watch
