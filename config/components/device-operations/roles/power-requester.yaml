apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: fleet.datumapis.com-device-power-requester
  annotations:
    kubernetes.io/display-name: Fleet Device Power Requester
    kubernetes.io/description: The Fleet provider for Metal. Creates DevicePowerOperations from Machine power intent and reads custody.
spec:
  launchStage: Alpha
  includedPermissions:
    - fleet.datumapis.com/devicepoweroperations.create
    - fleet.datumapis.com/devicepoweroperations.get
    - fleet.datumapis.com/devicepoweroperations.list
    - fleet.datumapis.com/devicepoweroperations.watch
    - fleet.datumapis.com/devicecustodies.get
    - fleet.datumapis.com/devicecustodies.list
    - fleet.datumapis.com/devicecustodies.watch
