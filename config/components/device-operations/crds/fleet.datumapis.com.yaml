                        maxLength: 64
                      extra:
                        type: object
                        maxProperties: 16
                        additionalProperties:
                          type: string
                          maxLength: 256
                  retryAuthorizedBy:
                    type: object
                    properties:
                      kind:
                        type: string
                        minLength: 1
                        maxLength: 63
