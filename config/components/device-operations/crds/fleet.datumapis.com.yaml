                        maxLength: 64
                      extra:
                        type: object
                        maxProperties: 16
                        additionalProperties:
                          type: string
                          maxLength: 256
                  creator:
                    type: object
                    properties:
                      username:
                        type: string
                        minLength: 1
                        maxLength: 512
                      uid:
                        type: string
                        minLength: 1
                        maxLength: 512
                    required:
