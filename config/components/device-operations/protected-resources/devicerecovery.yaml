apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: fleet.datumapis.com-devicerecovery
spec:
  serviceRef:
    name: fleet.datumapis.com
  kind: DeviceRecovery
  plural: devicerecoveries
  singular: devicerecovery
  # Status has one writer, the coordinator. With subresource authorization
  # enabled, status writes use devicerecoveries/status.update and
  # devicerecoveries/status.patch instead of updateStatus.
  permissions: [list, get, watch, create, update, patch, delete, updateStatus]
  subresources:
    - name: status
      permissions: [update, patch]
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
