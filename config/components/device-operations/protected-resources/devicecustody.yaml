apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: fleet.datumapis.com-devicecustody
spec:
  serviceRef:
    name: fleet.datumapis.com
  kind: DeviceCustody
  plural: devicecustodies
  singular: devicecustody
  # Custody keeps its fields in spec, like a Lease, and has no status. Only
  # the coordinator role holds a write verb.
  permissions: [list, get, watch, create, update, patch, delete]
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
