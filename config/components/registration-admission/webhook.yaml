apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: fleet-capacity-registration
webhooks:
  - name: registration.fleet.datumapis.com
    admissionReviewVersions: [v1]
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: NoneOnDryRun
    timeoutSeconds: 20
    clientConfig:
      url: https://fleet-registration.fleet-system.svc:9443/validate-registration
    rules:
      - apiGroups: [metal.datumapis.com]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [machinecapacities, machinecapacities/status]
        scope: Namespaced
      - apiGroups: [fleet.datumapis.com]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [devices, devices/status]
        scope: Namespaced
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [DELETE]
        resources: [namespaces]
        scope: Cluster
      - apiGroups: [resourcemanager.miloapis.com]
        apiVersions: [v1alpha1]
        operations: [DELETE]
        resources: [projects]
        scope: Cluster
