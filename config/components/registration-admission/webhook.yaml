apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: fleet-capacity-registration
webhooks:
  # Every capacity write is fail-closed. Creates are checked against live
  # Devices; updates, status writes and deletes are always denied.
  - name: registration.fleet.datumapis.com
    admissionReviewVersions: [v1]
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 20
    clientConfig:
      url: https://fleet-registration.fleet-system.svc:9443/validate-registration
    rules:
      - apiGroups: [metal.datumapis.com]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [machinecapacities, machinecapacities/status]
        scope: Namespaced
