apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: fleet.datumapis.com-inventory-manager
  annotations:
    kubernetes.io/display-name: Fleet Inventory Manager
    kubernetes.io/description: Create and maintain physical inventory records without deletion or operational control
spec:
  launchStage: Alpha
  inheritedRoles:
    - name: fleet.datumapis.com-inventory-viewer
  includedPermissions:
    - fleet.datumapis.com/deviceclaims.create
    - fleet.datumapis.com/deviceclaims.update
    - fleet.datumapis.com/deviceclaims.patch
    - fleet.datumapis.com/devices.create
    - fleet.datumapis.com/devices.update
    - fleet.datumapis.com/devices.patch
    - fleet.datumapis.com/facilities.create
    - fleet.datumapis.com/facilities.update
    - fleet.datumapis.com/facilities.patch
    - fleet.datumapis.com/racks.create
    - fleet.datumapis.com/racks.update
    - fleet.datumapis.com/racks.patch
    - fleet.datumapis.com/cables.create
    - fleet.datumapis.com/cables.update
    - fleet.datumapis.com/cables.patch
    - fleet.datumapis.com/powerfeeds.create
    - fleet.datumapis.com/powerfeeds.update
    - fleet.datumapis.com/powerfeeds.patch
