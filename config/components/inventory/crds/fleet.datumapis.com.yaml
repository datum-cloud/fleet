                    || self.banks.all(b, b.face != f || !has(b.offset)))"
                  message: bank offsets must be set on every bank of a face or on none
              componentTemplates:
                type: array
                maxItems: 256
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 63
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                    type:
                      type: string
                      enum:
                      - NetworkPort
                      - PowerInlet
                      - PowerOutlet
                      - ConsolePort
                      - ConsoleServerPort
                      - FrontPort
                      - RearPort
                      - Module
                      - InventoryItem
                      - DeviceBay
                    connector:
                      type: string
                      minLength: 1
                      maxLength: 253
                    positions:
                      type: integer
                      minimum: 1
                      maximum: 256
                    face:
                      type: string
                      enum:
                      - Front
                      - Rear
                    layout:
                      type: object
                      required:
                      - bank
                      - row
                      - column
                      properties:
                        bank:
                          type: string
                          minLength: 1
                          maxLength: 63
                        row:
                          type: integer
                          minimum: 1
                          maximum: 8
                        column:
                          type: integer
                          minimum: 1
                          maximum: 64
                        span:
                          type: integer
                          minimum: 1
                          maximum: 64
                  required:
                  - id
                  - name
                  - type
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-validations:
                # The overlap rule below compares every pair of templates. This
                # cap keeps its worst runtime cost near 60% of the per-call CEL
                # limit; 256 laid-out templates can exceed it. Evaluated first so
                # an over-cap object reports the cap, not a cost error.
                - rule: self.filter(t, has(t.layout)).size() <= 128
                  message: at most 128 templates may carry a layout; leave the rest without
                    one
                - rule: 'self.all(t, !has(t.layout) || self.exists_one(u, has(u.layout)
                    && u.layout.row == t.layout.row && u.layout.column < t.layout.column
                    + (has(t.layout.span) ? t.layout.span : 1) && t.layout.column < u.layout.column
                    + (has(u.layout.span) ? u.layout.span : 1) && u.layout.bank == t.layout.bank))'
                  message: two templates overlap in one bank row; each cell, including a
                    span, holds one template
            x-kubernetes-validations:
            - rule: '!has(self.componentTemplates) || self.componentTemplates.all(t, !has(t.layout)
                || has(t.face) && has(self.faceplate) && self.faceplate.banks.exists(b,
                b.id == t.layout.bank && b.face == t.face))'
              message: a template layout must name a faceplate bank on the template's own
                face
            - rule: '!has(self.componentTemplates) || !has(self.faceplate) || self.componentTemplates.all(t,
                !has(t.layout) || self.faceplate.banks.all(b, b.id != t.layout.bank ||
                t.layout.row <= b.rows && t.layout.column + (has(t.layout.span) ? t.layout.span
                : 1) - 1 <= b.columns))'
              message: a template layout, including its span, must fall inside its bank's
                rows and columns
            - rule: self.manufacturerRef == oldSelf.manufacturerRef && self.model
                == oldSelf.model
              message: manufacturer and normalized model identity are immutable; displayName
                is mutable
          status:
            type: object
