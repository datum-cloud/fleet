spec:
  group: fleet.datumapis.com
  names:
    kind: Cable
    listKind: CableList
    plural: cables
    singular: cable
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
