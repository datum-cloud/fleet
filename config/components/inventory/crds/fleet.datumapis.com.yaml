apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deviceclaims.fleet.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: fleet.datumapis.com
  names:
    kind: DeviceClaim
    listKind: DeviceClaimList
    plural: deviceclaims
    singular: deviceclaim
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Facility
      type: string
      jsonPath: .spec.placement.facility
    - name: Rack
      type: string
      jsonPath: .spec.placement.rack
    - name: Position
      type: integer
      jsonPath: .spec.placement.position
    - name: Model
      type: string
      jsonPath: .spec.expectedIdentity.model
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - expectedIdentity
            - placement
            x-kubernetes-validations:
            - rule: has(self.lifecycle) == has(oldSelf.lifecycle)
              message: legacy claims cannot be reinterpreted as installations
            - rule: '!has(self.lifecycle) || self.placement == oldSelf.placement'
              message: installation placement is immutable; migration requires an explicit handover
            - rule: '!has(self.lifecycle) || !has(self.ports) || self.ports.all(p, !has(p.expectedPeer))'
              message: Cable is the only expected topology authority for installations
            - rule: has(self.lifecycle) == has(self.placement.scope)
              message: typed placement requires an installation lifecycle; legacy slots keep their text placement
            properties:
              expectedIdentity:
                type: object
                required:
                - model
                properties:
                  manufacturer:
                    type: string
                    maxLength: 253
                  model:
                    type: string
                    minLength: 1
                    maxLength: 253
                  serial:
                    type: string
                    minLength: 1
                    maxLength: 253
              placement:
                type: object
                properties:
                  facility:
                    type: string
                    minLength: 1
                    maxLength: 253
                  rack:
                    type: string
                    minLength: 1
                    maxLength: 253
                  position:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 100
                  height:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 100
                  face:
                    type: string
                    enum:
                    - front
                    - rear
                  scope:
                    type: string
                    enum:
                    - Facility
                    - RackMembership
                    - RackUnits
                    - NonRackUnitMount
                  facilityRef: &id001
                    type: object
                    properties:
                      name:
                        type: string
                        maxLength: 253
                        pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                    required:
                    - name
                  rackRef: *id001
                  mount:
                    type: string
                    minLength: 1
                    maxLength: 253
                x-kubernetes-validations:
                - rule: 'has(self.scope) ? (!has(self.facility) && !has(self.rack)) : (has(self.facility) && has(self.rack)
                    && has(self.position) && has(self.face) && !has(self.facilityRef) && !has(self.rackRef) && !has(self.mount))'
                  message: choose legacy text placement or typed placement, never both
                - rule: '!has(self.scope) || (self.scope == ''Facility'' ? (has(self.facilityRef) && !has(self.rackRef))
                    : (has(self.rackRef) && !has(self.facilityRef)))'
                  message: typed placement requires exactly the reference appropriate to its scope
                - rule: '!has(self.scope) || (self.scope == ''RackUnits'' ? (has(self.position) && has(self.height)
                    && has(self.face) && !has(self.mount)) : (!has(self.position) && !has(self.height) && !has(self.face)
                    && (self.scope == ''NonRackUnitMount'' ? has(self.mount) : !has(self.mount))))'
                  message: partial placement cannot assert rack units; non-unit mounts require a mount identifier
              ports:
                type: array
                maxItems: 128
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                    type:
                      type: string
                      maxLength: 253
                    speedMbps:
                      type: integer
                      format: int64
                      minimum: 1
                    expectedPeer:
                      type: object
                      required:
                      - device
                      - port
                      properties:
                        device:
                          type: string
                          minLength: 1
                          maxLength: 253
                        port:
                          type: string
                          minLength: 1
                          maxLength: 253
              lifecycle:
                type: string
                enum:
                - Installation
              cableRefs:
                type: array
                maxItems: 256
                items: *id001
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
              displayName:
                type: string
                minLength: 1
                maxLength: 253
          status:
            type: object
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devices.fleet.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: fleet.datumapis.com
  names:
    kind: Device
    listKind: DeviceList
    plural: devices
    singular: device
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Claim
      type: string
      jsonPath: .spec.claimRef.name
    - name: Model
      type: string
      jsonPath: .spec.identity.model
    - name: Serial
      type: string
      jsonPath: .spec.identity.serial
    - name: System UUID
      type: string
      priority: 1
      jsonPath: .spec.identity.systemUUID
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - claimRef
            - identity
            x-kubernetes-validations:
            - rule: self.claimRef == oldSelf.claimRef
              message: claimRef is immutable; bind replacement hardware as a new Device
            - rule: self.identity == oldSelf.identity
              message: identity is immutable; a hardware swap is a new Device
            - rule: '!has(oldSelf.deviceTypeRef) || (has(self.deviceTypeRef) && self.deviceTypeRef == oldSelf.deviceTypeRef)'
              message: an assigned catalog reference cannot be removed or rebound
            - rule: '!has(oldSelf.reportedPlacement) || has(self.reportedPlacement)'
              message: retain a report; omit unknown location fields rather than removing the report
            - rule: '!has(self.reportedPlacement) || (oldSelf.hasValue() && has(oldSelf.value().reportedPlacement) ? (self.reportedPlacement == oldSelf.value().reportedPlacement || self.reportedPlacement.revision == oldSelf.value().reportedPlacement.revision + 1) : self.reportedPlacement.revision == 1)'
              optionalOldSelf: true
              message: first report revision must be 1; every changed report must increment revision exactly once
            - rule: '!has(self.interfaces) || self.interfaces.all(a, !has(a.macAddress) || (self.interfaces.filter(b,
                has(b.macAddress) && b.macAddress == a.macAddress).size() == 1 && (!has(self.unmappedMACAddresses)
                || !(a.macAddress in self.unmappedMACAddresses))))'
              message: a MAC address may be recorded only once
            - rule: '!has(self.topologyAuthority) || !has(self.interfaces) || self.interfaces.all(p, !has(p.peer))'
              message: Cable topology excludes inline peers
            - rule: '!has(self.components) || has(self.topologyAuthority)'
              message: typed components require Cable topology
            - rule: '!has(self.internalMappings) || (has(self.components) && self.internalMappings.all(m, (m.from.componentID
                != m.to.componentID || m.from.position != m.to.position) && self.components.exists(c, c.id == m.from.componentID
                && m.from.position <= (has(c.positions) ? c.positions : 1)) && self.components.exists(c, c.id ==
                m.to.componentID && m.to.position <= (has(c.positions) ? c.positions : 1))))'
              message: internal mappings must reference present component positions
            - rule: '!has(self.internalMappings) || self.internalMappings.all(m, self.internalMappings.filter(n,
                n.from == m.from).size() == 1)'
              message: each internal source position maps once
            - rule: '!has(self.internalMappings) || (has(self.components) && self.internalMappings.all(m, self.components.exists(c,
                c.id == m.from.componentID && c.type == ''FrontPort'') ? self.components.exists(c, c.id == m.to.componentID
                && c.type == ''RearPort'') : (self.components.exists(c, c.id == m.from.componentID && c.type ==
                ''PowerOutlet'') && self.components.exists(c, c.id == m.to.componentID && c.type == ''PowerInlet''))))'
              message: internal paths must map front to rear or power outlet to inlet
            - rule: '!has(self.internalMappings) || (has(self.components) && self.internalMappings.all(m, !self.components.exists(c,
                c.id == m.from.componentID && c.type == ''FrontPort'') || self.internalMappings.filter(n, n.to.componentID
                == m.to.componentID && n.to.position == m.to.position).size() == 1))'
              message: a pass-through rear position can be mapped only once
            - rule: '!has(self.serviceAssociations) || (has(self.components) && self.serviceAssociations.all(a,
                self.components.exists(c, c.id == a.componentID)))'
              message: service associations must reference present components
            properties:
              deviceTypeRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
              reportedPlacement:
                type: object
                required: [revision, observedAt, reason, reference]
                x-kubernetes-validations:
                - rule: '(!has(self.position) && !has(self.height) && !has(self.face) && !has(self.fullDepth) && !has(self.mount)) || has(self.rackRef)'
                  message: rack geometry requires a reported rack
                - rule: '!has(self.mount) || (!has(self.position) && !has(self.height) && !has(self.face) && !has(self.fullDepth))'
                  message: non-unit mounts cannot also report unit geometry
                - rule: '!has(self.position) || !has(self.height) || self.position + self.height <= 101.0'
                  message: reported geometry exceeds supported rack bounds
                properties:
                  revision:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    pattern: '\S'
                  reference:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    pattern: '\S'
                  observedAt:
                    type: string
                    format: date-time
                  facilityRef:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                  rackRef:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                  position:
                    type: number
                    minimum: 1
                    maximum: 100
                  height:
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 100
                  face:
                    type: string
                    enum: [front, rear]
                  fullDepth:
                    type: boolean
                  mount:
                    type: string
                    minLength: 1
                    maxLength: 253
              claimRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
              identity:
                type: object
                required:
                - model
                x-kubernetes-validations:
                - rule: has(self.serial) || has(self.systemUUID)
                  message: a device needs a serial or system UUID
                properties:
                  manufacturer:
                    type: string
                    maxLength: 253
                  model:
                    type: string
                    minLength: 1
                    maxLength: 253
                  serial:
                    type: string
                    minLength: 1
                    maxLength: 253
                  systemUUID:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
              bmc:
                type: object
                required:
                - endpoint
                properties:
                  endpoint:
                    type: string
                    maxLength: 2048
                    x-kubernetes-validations:
                    - rule: isURL(self) && url(self).getScheme() == 'https' && !self.contains('@') && url(self).getHostname()
                        != ''
                      message: bmc.endpoint must be an https URL without credentials
              interfaces:
                type: array
                maxItems: 32
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                    macAddress:
                      type: string
                      maxLength: 17
                      pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
                    peer:
                      type: object
                      required:
                      - device
                      - port
                      properties:
                        device:
                          type: string
                          minLength: 1
                          maxLength: 253
                        port:
                          type: string
                          minLength: 1
                          maxLength: 253
              unmappedMACAddresses:
                type: array
                maxItems: 32
                x-kubernetes-list-type: set
                items:
                  type: string
                  maxLength: 17
                  pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
              assetTag:
                type: string
                minLength: 1
                maxLength: 253
              providerHostRef:
                type: object
                properties:
                  system:
                    type: string
                    minLength: 1
                    maxLength: 253
                  type:
                    type: string
                    minLength: 1
                    maxLength: 253
                  id:
                    type: string
                    minLength: 1
                    maxLength: 253
                required:
                - system
                - type
                - id
              components:
                type: array
                maxItems: 256
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 63
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                    type:
                      type: string
                      enum:
                      - NetworkPort
                      - PowerInlet
                      - PowerOutlet
                      - ConsolePort
                      - ConsoleServerPort
                      - FrontPort
                      - RearPort
                      - Module
                      - InventoryItem
                      - DeviceBay
                    connector:
                      type: string
                      minLength: 1
                      maxLength: 253
                    positions:
                      type: integer
                      minimum: 1
                      maximum: 256
                    serial:
                      type: string
                      minLength: 1
                      maxLength: 253
                    assetTag:
                      type: string
                      minLength: 1
                      maxLength: 253
                  required:
                  - id
                  - name
                  - type
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - id
              internalMappings:
                type: array
                maxItems: 256
                items:
                  type: object
                  properties:
                    from: &id002
                      type: object
                      properties:
                        componentID:
                          type: string
                          minLength: 1
                          maxLength: 63
                        position:
                          type: integer
                          minimum: 1
                          maximum: 256
                      required:
                      - componentID
                      - position
                    to: *id002
                  required:
                  - from
                  - to
              serviceAssociations:
                type: array
                maxItems: 128
                items:
                  type: object
                  properties:
                    serviceRef:
                      type: object
                      properties:
                        system:
                          type: string
                          minLength: 1
                          maxLength: 253
                        type:
                          type: string
                          minLength: 1
                          maxLength: 253
                        id:
                          type: string
                          minLength: 1
                          maxLength: 253
                      required:
                      - system
                      - type
                      - id
                    componentID:
                      type: string
                      minLength: 1
                      maxLength: 63
                  required:
                  - serviceRef
                  - componentID
              topologyAuthority:
                type: string
                enum:
                - Cable
              displayName:
                type: string
                minLength: 1
                maxLength: 253
              modelShape:
                type: object
                properties:
                  heightUnits:
                    type: number
                    minimum: 0
                    maximum: 100
                  fullDepth:
                    type: boolean
          status:
            type: object
---
