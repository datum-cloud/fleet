            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              displayName:
                type: string
                minLength: 1
                maxLength: 253
              medium:
                type: string
                enum:
                - Copper
                - Fiber
                - Power
                - Console
                - Unknown
              lanes:
                type: array
                maxItems: 64
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 63
                    a: &id002
                      type: object
                      properties:
                        deviceRef: &id001
                          type: object
                          properties:
                            name:
                              type: string
                              maxLength: 253
                              pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
