      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - displayName
            - manufacturerRef
            - model
            properties:
              displayName:
                type: string
                minLength: 1
                maxLength: 253
              manufacturerRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
              model:
                type: string
                minLength: 1
                maxLength: 253
                pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
              modelShape:
                type: object
                properties:
                  heightUnits:
                    type: number
                    minimum: 0
                    maximum: 100
                  fullDepth:
                    type: boolean
                  width:
                    type: string
                    enum:
                    - Full
                    - Half
              faceplate:
                type: object
                required:
                - banks
                properties:
                  banks:
                    type: array
                    minItems: 1
                    maxItems: 32
                    items:
                      type: object
                      required:
                      - id
                      - face
                      - rows
                      - columns
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 63
                        face:
                          type: string
                          enum:
                          - Front
                          - Rear
                        rows:
                          type: integer
                          minimum: 1
                          maximum: 8
                        columns:
                          type: integer
                          minimum: 1
                          maximum: 64
                        offset:
                          type: number
                          minimum: 0
                          maximum: 1
                        cellMM:
                          type: object
                          required:
                          - width
                          - height
                          properties:
                            width:
                              type: number
                              minimum: 1
                              maximum: 450
                            height:
                              type: number
                              minimum: 1
                              maximum: 400
                    x-kubernetes-list-type: map
                    x-kubernetes-list-map-keys:
