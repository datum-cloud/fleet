                        powerFeedRef: *id001
                        componentID:
                          type: string
                          minLength: 1
                          maxLength: 63
                        position:
                          type: integer
                          minimum: 1
                          maximum: 256
                      required:
                      - componentID
                      - position
                      x-kubernetes-validations:
                      - rule: has(self.deviceRef) != has(self.powerFeedRef)
                        message: exactly one local endpoint owner is required
                    b: *id002
                  required:
                  - id
                  - a
                  - b
                  x-kubernetes-validations:
                  - rule: '!(self.a.componentID == self.b.componentID && self.a.position == self.b.position && ((has(self.a.deviceRef)
                      && has(self.b.deviceRef) && self.a.deviceRef.name == self.b.deviceRef.name) || (has(self.a.powerFeedRef)
                      && has(self.b.powerFeedRef) && self.a.powerFeedRef.name == self.b.powerFeedRef.name)))'
