apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: fleet.datumapis.com-device
spec:
  serviceRef:
    name: fleet.datumapis.com
  kind: Device
  plural: devices
  singular: device
  # updateStatus is held only by the discoverer role. With subresource
  # authorization enabled, status writes use devices/status.update and
  # devices/status.patch instead.
  permissions: [list, get, watch, create, update, patch, delete, updateStatus]
  subresources:
    - name: status
      permissions: [update, patch]
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
