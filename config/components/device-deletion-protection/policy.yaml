# A Device is deleted only after it is Retired, so a Device in service stays
# visible to duplicate-hardware checks. Retire a Device by moving
# spec.lifecycle to Decommissioning and then Retired; the CRD rejects every
# other path to Retired, and Retired is terminal.
#
# The one other exception is a Device whose namespace is being deleted
# (namespaceObject.metadata.deletionTimestamp is set). Deleting a namespace is
# the privileged escape hatch: it lets the namespace controller finish and
# takes its Devices with it. Nothing keys off who makes the request, and there
# are no exemptions. The API server runs admission once per object for
# deletecollection, garbage collection and namespace cleanup, so each of those
# paths is held to the same rule. A missing namespace object or an evaluation
# error denies the request (failurePolicy: Fail).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleet-device-deletion-protection
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [fleet.datumapis.com]
        apiVersions: ['*']
        operations: [DELETE]
        resources: [devices]
  validations:
    - expression: >-
        (namespaceObject != null && has(namespaceObject.metadata) &&
        has(namespaceObject.metadata.deletionTimestamp)) ||
        (oldObject != null && has(oldObject.spec) && has(oldObject.spec.lifecycle) &&
        oldObject.spec.lifecycle == 'Retired')
      reason: Forbidden
      message: >-
        Only a Retired Device can be deleted. Move the Device to Decommissioning,
        then Retired, first; its identity must stay visible to duplicate-hardware
        checks while it is in service.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleet-device-deletion-protection
spec:
  policyName: fleet-device-deletion-protection
  validationActions: [Deny]
