# Redfish lab with synchronized DHCP (run.sh --redfish --synced-dhcp): the
# Redfish graph with the site enrollment's DHCP mode set to synced, so a
# network boot needs a boot address and waits for the site's Kea to apply and
# later withdraw its reservation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../graph
patches:
  - target: {kind: ResourceGraphDefinition, name: fleet-handoff-dispatcher}
    patch: |-
      - op: test
        path: /spec/resources/9/template/spec/template/spec/containers/0/env/6/name
        value: FLEET_REDFISH_ENROLLMENT
      - op: replace
        path: /spec/resources/9/template/spec/template/spec/containers/0/env/6/value
        value: '{"dhcp":"synced","targets":[{"device":"fleet-provider/synthetic-device-central-01","endpoint":"https://10.96.0.81:8443","systemID":"System-1","systemUUID":"7f3d0c2e-1a5b-4c6d-8e9f-0a1b2c3d4e0a","diskBytes":2147483648,"console":"target-a.log"},{"device":"fleet-provider/synthetic-device-central-02","endpoint":"https://10.96.0.81:8443","systemID":"System-2","systemUUID":"7f3d0c2e-1a5b-4c6d-8e9f-0a1b2c3d4e0b","diskBytes":2147483648,"console":"target-b.log"}]}'
