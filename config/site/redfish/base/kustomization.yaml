# Redfish-mode site base: the shared base plus the lab BMC identity, with the
# kro worker admission policy narrowed for Redfish workers. Selected by the
# environment's fleet-site-base path (hack/multiplane/flux.py --provider redfish).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - bmc.yaml
  - credentials.yaml
patches:
  - target: {kind: ValidatingAdmissionPolicy, name: fleet-site-kro-worker-jobs}
    patch: |-
      # Redfish workers reach the lab hardware only through Redfish: no
      # libvirt socket mount and no libvirt URI, and the Redfish provider.
      - op: add
        path: /spec/validations/-
        value:
          expression: >-
            variables.pod.containers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m,
            !(has(m.subPath) && m.subPath.startsWith('libvirt')) && !m.mountPath.startsWith('/run/fleet-libvirt') && !m.mountPath.startsWith('/var/lib/fleet-lab/disks')))
          message: a Redfish worker Job must not mount the libvirt socket or lab disks
      - op: add
        path: /spec/validations/-
        value:
          expression: >-
            variables.pod.containers.all(c, has(c.env) &&
            c.env.exists(e, e.name == 'FLEET_SITE_PROVIDER' && has(e.value) && e.value == 'redfish') &&
            !c.env.exists(e, e.name == 'FLEET_LIBVIRT_URI'))
          message: a Redfish worker Job must select the Redfish provider and carry no libvirt URI
  # kro may create, in fleet-site-credentials, only a per-operation Role
  # that gets one named credential Secret, bound to that operation's own
  # ServiceAccount.
  - target: {kind: ValidatingAdmissionPolicy, name: fleet-site-kro-worker-identity}
    patch: |-
      - op: test
        path: /spec/validations/2/message
        value: a worker Role may grant only get on its own handoff and on its own payload
      - op: replace
        path: /spec/matchConstraints/namespaceSelector/matchExpressions/0/values
        value: [fleet-site, fleet-coordination, fleet-site-credentials]
      - op: replace
        path: /spec/validations/2
        value:
          expression: >-
            variables.kind != 'roles' || (request.namespace == 'fleet-site-credentials' ?
            (has(object.rules) && size(object.rules) == 1 && object.rules.all(r, r.apiGroups == [''] &&
            r.resources == ['secrets'] && r.verbs == ['get'] && has(r.resourceNames) && size(r.resourceNames) == 1 &&
            r.resourceNames.all(n, n.matches('^bmc-[a-f0-9]{20}$')))) :
            (has(object.rules) && size(object.rules) == 2 &&
            object.rules[0].apiGroups == ['coordination.fleet.datumapis.com'] &&
            object.rules[0].resources == ['machineallocationhandoffs'] && object.rules[0].verbs == ['get'] &&
            has(object.rules[0].resourceNames) && object.rules[0].resourceNames == [variables.handoff] &&
            !has(object.rules[0].nonResourceURLs) &&
            object.rules[1].apiGroups == ['coordination.fleet.datumapis.com'] &&
            object.rules[1].resources == ['machineallocationpayloads'] && object.rules[1].verbs == ['get'] &&
            has(object.rules[1].resourceNames) && object.rules[1].resourceNames == [variables.handoff + '-payload'] &&
            !has(object.rules[1].nonResourceURLs)))
          message: a worker Role may grant only get on its own handoff and on its own payload, or get on one named BMC credential
