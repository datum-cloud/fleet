# The site's per-Device BMC credential Secrets, by the BMC discovery contract.
# The harness enrolls them; they are never part of a source revision. Only
# credential Secrets live here, and each worker selects its Device's by the
# contract's annotations, then requires its approved pin.
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-site-credentials
  annotations:
    # Deleting the namespace deletes the enrolled credentials. Never prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# To create a per-operation Role that lists Secrets here, kro itself must hold
# that permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-site-kro-worker-credentials, namespace: fleet-site-credentials}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-site-kro-worker-credentials, namespace: fleet-site-credentials}
subjects:
  - {kind: ServiceAccount, name: kro, namespace: kro-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-site-kro-worker-credentials}
