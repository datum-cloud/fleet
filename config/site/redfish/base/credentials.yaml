# The site's per-Device BMC credential Secrets, by the BMC discovery contract.
# The harness enrolls them; they are never part of a source revision. Each
# Secret is named from its Device (bmc- and 20 hex digits of the Device's
# SHA-256), and each worker may get only its own Device's, then requires the
# contract's annotations and its approved pin.
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-site-credentials
  labels:
    # Holds only credential Secrets; hack/validate-bmc-credential-namespace.sh
    # fails a render that adds any other Secret here.
    fleet.datumapis.com/bmc-credential-namespace: "true"
  annotations:
    # Deleting the namespace deletes the enrolled credentials. Never prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# To create a per-operation Role that gets a credential Secret here, kro
# itself must hold get on it. kro cannot list or watch them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-site-kro-worker-credentials, namespace: fleet-site-credentials}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-site-kro-worker-credentials, namespace: fleet-site-credentials}
subjects:
  - {kind: ServiceAccount, name: kro, namespace: kro-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-site-kro-worker-credentials}
