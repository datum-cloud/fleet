# The feed, reachable only inside the site cluster.
apiVersion: v1
kind: Service
metadata:
  name: fleet-site-dhcp-feed
  namespace: fleet-site
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: fleet-site-boot}
  ports:
    - {name: dhcp-feed, port: 8081, targetPort: 8081, protocol: TCP}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-site-dhcp, namespace: fleet-site}
automountServiceAccountToken: false
---
# Kea DHCPv4 instances. Each Pod's name is its stable instance name in the
# applied reports. Pods use host networking on nodes that network operations
# labels as DHCP hosts, one per node. The base configuration's relay filter
# limits Kea to relayed requests from the site's relays. Scale down only after the instance being removed
# reports an empty feed: an instance removed while serving keeps its
# operations' outcomes unknown until an operator retires it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-site-dhcp
  namespace: fleet-site
spec:
  serviceName: fleet-site-dhcp
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-site-dhcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fleet-site-dhcp}
    spec:
      serviceAccountName: fleet-site-dhcp
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {fleet.datumapis.com/dhcp-host: "true"}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/name: fleet-site-dhcp}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kea
          # ISC's image, pinned by digest. It is built for linux/amd64 only.
          image: docker.cloudsmith.io/isc/docker/kea-dhcp4:2.6.3@sha256:c40abb1522b15edb9a6d1119ad22b3765bf818a51d6776f498e874ad13416065
          # Kea 2.6 refuses a control socket directory that is not 0750,
          # and an emptyDir is created 0777.
          command: [sh, -c, 'chmod 0750 /var/run/kea && exec kea-dhcp4 -c /etc/kea-base/kea-dhcp4.conf']
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE, NET_RAW]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: base, mountPath: /etc/kea-base, readOnly: true}
            - {name: control, mountPath: /var/run/kea}
        - name: sync
          image: "${FLEET_DHCP_SYNC_IMAGE}"
          imagePullPolicy: IfNotPresent
          command:
            - /fleet-dhcp-sync
            - -feed=https://fleet-site-dhcp-feed.fleet-site.svc:8081
            - -token-file=/etc/fleet-dhcp/token
            - -ca-file=/etc/fleet-dhcp-tls/ca.crt
            - -kea-socket=/var/run/kea/kea4-ctrl-socket
            - -base-config=/etc/kea-base/kea-dhcp4.conf
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: base, mountPath: /etc/kea-base, readOnly: true}
            - {name: control, mountPath: /var/run/kea}
            - {name: token, mountPath: /etc/fleet-dhcp, readOnly: true}
            - {name: feed-ca, mountPath: /etc/fleet-dhcp-tls, readOnly: true}
      volumes:
        - name: base
          configMap: {name: fleet-site-dhcp-base}
        - name: control
          emptyDir: {}
        - name: token
          secret: {secretName: fleet-site-dhcp-sync, defaultMode: 0400}
        - name: feed-ca
          secret: {secretName: fleet-site-dhcp-feed-tls, defaultMode: 0400, items: [{key: ca.crt, path: ca.crt}]}
---
# One instance may restart at a time. Draining before scale-down is an
# operator step; see the comment on the StatefulSet.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleet-site-dhcp
  namespace: fleet-site
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-site-dhcp}
