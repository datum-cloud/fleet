apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-site-dhcp, namespace: fleet-site}
automountServiceAccountToken: false
---
# One site's Kea DHCPv4 instances, in a central cluster rather than at the
# site. Each Pod's name is its stable instance name in the applied reports,
# so a StatefulSet, never a Deployment: a replaced Pod keeps its name and its
# last report. The instances share one load-balancer address on UDP 67
# (below), which the site's relays reach over the WAN link. Kea answers only relayed
# requests, on a UDP socket, so it needs no host networking; the base
# configuration's relay filter limits it to the site's relays. The site's
# enrollment lists these Pods' names as its expected DHCP instances. To
# retire one, make sure it no longer answers, scale down (the highest
# ordinal goes first), shrink the enrollment's dhcpInstances to match, and
# restart the site's workers and feed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-site-dhcp
  namespace: fleet-site
spec:
  serviceName: fleet-site-dhcp
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-site-dhcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fleet-site-dhcp}
    spec:
      serviceAccountName: fleet-site-dhcp
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/name: fleet-site-dhcp}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kea
          # ISC's image, pinned by digest. It is built for linux/amd64 only.
          image: docker.cloudsmith.io/isc/docker/kea-dhcp4:2.6.3@sha256:c40abb1522b15edb9a6d1119ad22b3765bf818a51d6776f498e874ad13416065
          # Kea 2.6 refuses a control socket directory that is not 0750,
          # and an emptyDir is created 0777.
          command: [sh, -c, 'chmod 0750 /var/run/kea && exec kea-dhcp4 -c /etc/kea-base/kea-dhcp4.conf']
          ports:
            - {name: dhcp, containerPort: 67, protocol: UDP}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: base, mountPath: /etc/kea-base, readOnly: true}
            - {name: control, mountPath: /var/run/kea}
        - name: sync
          image: "${FLEET_DHCP_SYNC_IMAGE}"
          imagePullPolicy: IfNotPresent
          command:
            - /fleet-dhcp-sync
            # The site's feed, over TLS only, wherever the site's boot Pod
            # runs.
            - -feed=${FLEET_DHCP_FEED_URL}
            - -token-file=/etc/fleet-dhcp/token
            - -ca-file=/etc/fleet-dhcp-tls/ca.crt
            - -kea-socket=/var/run/kea/kea4-ctrl-socket
            - -base-config=/etc/kea-base/kea-dhcp4.conf
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: base, mountPath: /etc/kea-base, readOnly: true}
            - {name: control, mountPath: /var/run/kea}
            - {name: token, mountPath: /etc/fleet-dhcp, readOnly: true}
            - {name: feed-ca, mountPath: /etc/fleet-dhcp-tls, readOnly: true}
      volumes:
        - name: base
          configMap: {name: fleet-site-dhcp-base}
        - name: control
          emptyDir: {}
        - name: token
          secret: {secretName: fleet-site-dhcp-sync, defaultMode: 0400}
        - name: feed-ca
          secret: {secretName: fleet-site-dhcp-feed-tls, defaultMode: 0400, items: [{key: ca.crt, path: ca.crt}]}
---
# One instance may restart at a time. Retiring an instance is an operator
# step; see the comment on the StatefulSet.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleet-site-dhcp
  namespace: fleet-site
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-site-dhcp}
---
# One load-balancer address on UDP 67 for all of the site's instances, which
# the site's relays forward to. Any instance may answer a request. Each
# instance applies the same feed through its own synchronizer and reports it
# under its own stable name, so the withdrawal gate covers every expected one;
# an instance that has not applied a reservation yet stays silent, because
# Kea is not authoritative, and the firmware retries. Client-IP affinity
# keeps one relay's exchange on one instance. Kea replies to the relay
# address in each request; the site's relays must accept replies from the
# cluster's egress address.
apiVersion: v1
kind: Service
metadata:
  name: fleet-site-dhcp
  namespace: fleet-site
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  selector: {app.kubernetes.io/name: fleet-site-dhcp}
  ports:
    - {name: dhcp, port: 67, targetPort: 67, protocol: UDP}
