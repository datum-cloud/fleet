apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-synthetic-provider
  namespace: fleet-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleet-synthetic-provider-state
  namespace: fleet-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-synthetic-provider
  namespace: fleet-system
spec:
  replicas: 1
  # The simulator state file has one writer; never overlap provider pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-synthetic-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-synthetic-provider
        app.kubernetes.io/component: synthetic-provider
    spec:
      serviceAccountName: fleet-synthetic-provider
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: ghcr.io/datum-cloud/fleet:latest
          imagePullPolicy: IfNotPresent
          command: [/fleet-simulator]
          args:
            - --listen-address=0.0.0.0:8090
            - --runtime-token-file=/var/run/fleet/provider/token
            - --state-file=/var/lib/fleet/state.json
          ports:
            - name: runtime
              containerPort: 8090
          readinessProbe:
            httpGet: {path: /readyz, port: runtime}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: runtime}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: state
              mountPath: /var/lib/fleet
            - name: runtime-token
              mountPath: /var/run/fleet/provider
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: fleet-synthetic-provider-state
        - name: runtime-token
          secret:
            secretName: fleet-synthetic-provider-auth
            defaultMode: 0440
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-synthetic-provider
  namespace: fleet-system
spec:
  selector:
    app.kubernetes.io/name: fleet-synthetic-provider
  ports:
    - name: runtime
      port: 8090
      targetPort: runtime
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-synthetic-provider
  namespace: fleet-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-synthetic-provider
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-manager
      ports:
        - protocol: TCP
          port: 8090
  egress: []
