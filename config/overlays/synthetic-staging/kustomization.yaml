apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../management-plane
  - provider.yaml
patches:
  - path: registration-exclusion.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: fleet-manager
      namespace: fleet-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-staging
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-provider-url=http://fleet-synthetic-provider.fleet-system.svc:8090
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-provider-token-file=/var/run/fleet/provider/token
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-consumer-project-name=$(FLEET_CONSUMER_PROJECT_NAME)
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-provider-project-name=$(FLEET_PROVIDER_PROJECT_NAME)
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-published-class-name=$(FLEET_PUBLISHED_CLASS_NAME)
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-published-profile-name=$(FLEET_PUBLISHED_PROFILE_NAME)
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-coordinator-token-file=/var/run/fleet/coordinator/token
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-release-token-file=/var/run/fleet/release/token
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-projector-token-file=/var/run/fleet/projector/token
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --synthetic-site-enrollment-file=/etc/fleet/enrollment/enrollment.json
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
        - name: FLEET_CONSUMER_PROJECT_NAME
          valueFrom:
            configMapKeyRef:
              name: fleet-manager-config
              key: consumerProjectName
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FLEET_PROVIDER_PROJECT_NAME
          valueFrom:
            configMapKeyRef:
              name: fleet-manager-config
              key: providerProjectName
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FLEET_PUBLISHED_CLASS_NAME
          valueFrom:
            configMapKeyRef:
              name: fleet-manager-config
              key: publishedClassName
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FLEET_PUBLISHED_PROFILE_NAME
          valueFrom:
            configMapKeyRef:
              name: fleet-manager-config
              key: publishedProfileName
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: synthetic-provider-token
          mountPath: /var/run/fleet/provider
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: custody-coordinator-token
          mountPath: /var/run/fleet/coordinator
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: release-controller-token
          mountPath: /var/run/fleet/release
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: capacity-projector-token
          mountPath: /var/run/fleet/projector
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: synthetic-site-enrollment
          mountPath: /etc/fleet/enrollment
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: custody-coordinator-token
          secret:
            secretName: fleet-custody-coordinator-auth
            defaultMode: 0440
            items:
              - key: token
                path: token
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: release-controller-token
          secret:
            secretName: fleet-release-controller-auth
            defaultMode: 0440
            items:
              - key: token
                path: token
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: capacity-projector-token
          secret:
            secretName: fleet-capacity-projector-auth
            defaultMode: 0440
            items:
              - key: token
                path: token
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: synthetic-site-enrollment
          configMap:
            name: fleet-synthetic-site-enrollment
            defaultMode: 0440
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: synthetic-provider-token
          secret:
            secretName: fleet-synthetic-provider-auth
            defaultMode: 0440
            items:
              - key: token
                path: token
