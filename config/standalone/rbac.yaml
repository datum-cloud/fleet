apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fleet-standalone-fixture-reader}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [fleet-project-a, fleet-project-b]
    verbs: [get]
  - apiGroups: [fleet.datumapis.com]
    resources: [machineclasses]
    resourceNames: [standard-metal]
    verbs: [get]
  - apiGroups: [fleet.datumapis.com]
    resources: [machineprofiles]
    resourceNames: [general-purpose-24c-128g]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fleet-standalone-fixture-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleet-standalone-fixture-reader}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-synthetic-provider-writer, namespace: fleet-provider}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [machinecapacities]
    resourceNames: [central1-baremetal-01]
    verbs: [get]
  - apiGroups: [fleet.datumapis.com]
    resources: [machinecapacities/status]
    resourceNames: [central1-baremetal-01]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-synthetic-provider-writer, namespace: fleet-provider}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-synthetic-provider-writer}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-a}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [machines]
    resourceNames: [allocation]
    verbs: [get, update, delete]
  - apiGroups: [fleet.datumapis.com]
    resources: [machines/status]
    resourceNames: [allocation]
    verbs: [get, update]
  - apiGroups: [fleet.datumapis.com]
    resources: [installations]
    resourceNames: [debian-12]
    verbs: [get]
  - apiGroups: [fleet.datumapis.com]
    resources: [installations/status]
    resourceNames: [debian-12]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-a}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-synthetic-consumer-writer}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-b}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [machines]
    resourceNames: [allocation]
    verbs: [get, update]
  - apiGroups: [fleet.datumapis.com]
    resources: [machines/status]
    resourceNames: [allocation]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-b}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-synthetic-consumer-writer}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-private-record-writer, namespace: fleet-system-private}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-private-record-writer, namespace: fleet-system-private}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-private-record-writer}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
