apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fleet-standalone-fixture-reader}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [fleet-project-a, fleet-project-b]
    verbs: [get]
  - apiGroups: [metal.datumapis.com]
    resources: [machineclasses]
    resourceNames: [standard-metal]
    verbs: [get]
  - apiGroups: [metal.datumapis.com]
    resources: [machineprofiles]
    resourceNames: [general-purpose-24c-128g]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fleet-standalone-fixture-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleet-standalone-fixture-reader}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-synthetic-provider-writer, namespace: fleet-provider}
rules:
  # The Metal provider selects capacity, records allocations and creates
  # installations. It reads custody and Devices only to skip taken capacity;
  # custody decides.
  - apiGroups: [metal.datumapis.com]
    resources: [machinecapacities]
    verbs: [get, list]
  - apiGroups: [metal.datumapis.com]
    resources: [machinecapacities/status]
    resourceNames: [central1-baremetal-01]
    verbs: [get, update]
  - apiGroups: [metal.datumapis.com]
    resources: [machineallocations]
    verbs: [get, list, create, delete]
  - apiGroups: [metal.datumapis.com]
    resources: [machineallocations/status]
    verbs: [get, update]
  - apiGroups: [fleet.datumapis.com]
    resources: [deviceinstallations]
    verbs: [get, list, create]
  - apiGroups: [fleet.datumapis.com]
    resources: [devices, devicecustodies]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-synthetic-provider-writer, namespace: fleet-provider}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-synthetic-provider-writer}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-a}
rules:
  - apiGroups: [metal.datumapis.com]
    resources: [machines]
    resourceNames: [allocation]
    verbs: [get, update, delete]
  - apiGroups: [metal.datumapis.com]
    resources: [machines/status]
    resourceNames: [allocation]
    verbs: [get, update]
  - apiGroups: [metal.datumapis.com]
    resources: [installations]
    resourceNames: [debian-12, debian-12-reinstall]
    verbs: [get]
  - apiGroups: [metal.datumapis.com]
    resources: [installations/status]
    resourceNames: [debian-12, debian-12-reinstall]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-a}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-synthetic-consumer-writer}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-b}
rules:
  - apiGroups: [metal.datumapis.com]
    resources: [machines]
    resourceNames: [allocation]
    verbs: [get, update]
  - apiGroups: [metal.datumapis.com]
    resources: [machines/status]
    resourceNames: [allocation]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-synthetic-consumer-writer, namespace: fleet-project-b}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-synthetic-consumer-writer}
subjects:
  - {kind: ServiceAccount, name: fleet-standalone-smoke, namespace: fleet-system}
---
# The custody coordinator writes custody and operation status, and reads the
# Devices, allocations and operations custody depends on.
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-custody-coordinator, namespace: fleet-system}
---
apiVersion: v1
kind: Secret
metadata:
  name: fleet-custody-coordinator-token
  namespace: fleet-system
  annotations: {kubernetes.io/service-account.name: fleet-custody-coordinator}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-custody-coordinator, namespace: fleet-provider}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [devices]
    verbs: [get, list, watch]
  - apiGroups: [fleet.datumapis.com]
    resources: [devicecustodies]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [fleet.datumapis.com]
    resources: [deviceinstallations, devicewipes, devicepoweroperations, devicerecoveries]
    verbs: [get, list, watch, delete]
  - apiGroups: [fleet.datumapis.com]
    resources: [deviceinstallations/status, devicewipes/status, devicepoweroperations/status, devicerecoveries/status]
    verbs: [get, update]
  - apiGroups: [metal.datumapis.com]
    resources: [machineallocations]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-custody-coordinator, namespace: fleet-provider}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-custody-coordinator}
subjects:
  - {kind: ServiceAccount, name: fleet-custody-coordinator, namespace: fleet-system}
---
# A BMC key must be unique among every Device that is not retired, so the
# coordinator reads Devices in every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fleet-custody-coordinator-devices}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [devices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fleet-custody-coordinator-devices}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleet-custody-coordinator-devices}
subjects:
  - {kind: ServiceAccount, name: fleet-custody-coordinator, namespace: fleet-system}
---
# The release controller creates the wipes of a release.
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-release-controller, namespace: fleet-system}
---
apiVersion: v1
kind: Secret
metadata:
  name: fleet-release-controller-token
  namespace: fleet-system
  annotations: {kubernetes.io/service-account.name: fleet-release-controller}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-release-controller, namespace: fleet-provider}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [devicewipes]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-release-controller, namespace: fleet-provider}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-release-controller}
subjects:
  - {kind: ServiceAccount, name: fleet-release-controller, namespace: fleet-system}
---
# The simulator site's fixture discovery writes only the status of the
# Device it serves.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-simulator-discovery, namespace: fleet-provider}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [devices]
    resourceNames: [synthetic-device-central-01]
    verbs: [get]
  - apiGroups: [fleet.datumapis.com]
    resources: [devices/status]
    resourceNames: [synthetic-device-central-01]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-simulator-discovery, namespace: fleet-provider}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-simulator-discovery}
subjects:
  - {kind: ServiceAccount, name: fleet-simulator, namespace: fleet-system}
