apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  fleet.datumapis.com/standalone-only: "true"
resources:
  - ../base/crd
  - ../base/simulator
  - namespaces.yaml
  - runtime-secret.yaml
  - rbac.yaml
  - fixtures.yaml
  - smoke-cronjobs.yaml
images:
  - name: ghcr.io/datum-cloud/fleet-simulator
    newName: fleet-simulator
    newTag: standalone-local
  - name: ghcr.io/datum-cloud/fleet-standalone-smoke
    newName: fleet-standalone-smoke
    newTag: standalone-local
