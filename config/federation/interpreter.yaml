# The gateway writes status only on its cell-local copy. Karmada reflects all
# member statuses and this interpreter accepts only the member identity pinned
# into the protected allocation binding and hub-copy label. A claimed route can
# only be replaced by status for the same route.
apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: fleet-projected-machine-management-session
spec:
  target:
    apiVersion: coordination.fleet.datumapis.com/v1alpha1
    kind: ProjectedMachineManagementSession
  customizations:
    statusReflection:
      luaScript: |
        function ReflectStatus(observedObj)
          if observedObj.status == nil then
            return nil
          end
          return observedObj.status
        end
    statusAggregation:
      luaScript: |
        local function weight(status)
          if status == nil then return 0 end
          if status.conditions ~= nil then
            for i = 1, #status.conditions do
              if status.conditions[i].type == "CleanupConfirmed" and status.conditions[i].status == "True" then
                return 4
              end
            end
          end
          if status.connection ~= nil then return 3 end
          if status.conditions == nil then return 0 end
          for i = 1, #status.conditions do
            if status.conditions[i].type == "Ready" and status.conditions[i].status == "False" then
              return 2
            end
          end
          if #status.conditions > 0 then return 1 end
          return 0
        end

        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil or desiredObj.metadata == nil or desiredObj.metadata.labels == nil then
            return desiredObj
          end
          local member = desiredObj.metadata.labels["fleet.datumapis.com/member-cluster"]
          if member == nil or member == "" then return desiredObj end
          local claimed = nil
          if desiredObj.status ~= nil and desiredObj.status.connection ~= nil then
            claimed = desiredObj.status.connection.routeID
          end
          local best = nil
          local bestWeight = 0
          for i = 1, #statusItems do
            local item = statusItems[i]
            local status = item.status
            local sameClaim = claimed == nil or status == nil or status.connection == nil or status.connection.routeID == claimed
            if item.clusterName == member and sameClaim and weight(status) > bestWeight then
              best = status
              bestWeight = weight(status)
            end
          end
          if best == nil or bestWeight < weight(desiredObj.status) then return desiredObj end
          desiredObj.status = best
          return desiredObj
        end
