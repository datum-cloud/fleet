apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-projector
  namespace: machine-access-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-projector
  namespace: machine-access-system
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [projectedmachinemanagementsessions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [fleet.datumapis.com]
    resources: [projectedmachinemanagementsessions/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-projector
  namespace: machine-access-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-projector
subjects:
  - kind: ServiceAccount
    name: fleet-projector
    namespace: machine-access-system
