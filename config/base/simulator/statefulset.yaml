apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-simulator
  namespace: fleet-system
spec:
  serviceName: fleet-simulator
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-simulator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fleet-simulator}
    spec:
      serviceAccountName: fleet-simulator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: simulator
          image: ghcr.io/datum-cloud/fleet-simulator:v0.0.0-dev
          imagePullPolicy: Never
          args:
            - --listen-address=0.0.0.0:8080
            - --runtime-token-file=/var/run/fleet/token
            - --state-file=/var/lib/fleet/state.json
          ports: [{name: runtime, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: runtime}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: runtime}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: state, mountPath: /var/lib/fleet}
            - {name: runtime-token, mountPath: /var/run/fleet, readOnly: true}
      volumes:
        - name: runtime-token
          secret: {secretName: fleet-simulator-runtime, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 64Mi}}
