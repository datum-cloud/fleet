apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The power operation dispatcher for one Milo project, and the site admission
# policies for its workers. Apply it in the namespace that holds BMC
# discovery's credential Secrets; the deploying repository sets that
# namespace, the image digest (in images: and both workerImage values), the
# Milo kubeconfig Secret and the config values. worker-policy.yaml is
# cluster-scoped. See docs/operations/device-power.md.
resources:
  - rbac.yaml
  - deployment.yaml
  - worker-policy.yaml
  - worker-policy-params.yaml
configMapGenerator:
  - name: fleet-device-power-config
    files:
      - config.yaml
