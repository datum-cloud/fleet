apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-device-power-dispatcher
---
# The dispatcher writes stage records, worker Jobs, their ServiceAccounts and
# Roles, and per-Device Leases in its own namespace. It holds no Secret or
# Pod permission, so it cannot read a BMC credential. It may create a Job
# that mounts one; worker-policy.yaml limits what that Job can be.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-device-power-dispatcher
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-device-power-dispatcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-device-power-dispatcher
subjects:
  - kind: ServiceAccount
    name: fleet-device-power-dispatcher
