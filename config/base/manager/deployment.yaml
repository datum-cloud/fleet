apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-manager
  namespace: fleet-system
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-manager
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: fleet-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/datum-cloud/fleet:latest
          imagePullPolicy: IfNotPresent
          args:
            - --authority-id=$(FLEET_AUTHORITY_ID)
            - --project-uid=$(FLEET_PROJECT_UID)
            - --project-route=$(FLEET_PROJECT_ROUTE)
            - --private-namespace=fleet-system-private
            - --project-kubeconfig=/var/run/fleet/milo/kubeconfig
            - --leader-election-namespace=fleet-system
          env:
            - name: FLEET_AUTHORITY_ID
              valueFrom:
                configMapKeyRef:
                  name: fleet-manager-config
                  key: authorityID
            - name: FLEET_PROJECT_UID
              valueFrom:
                configMapKeyRef:
                  name: fleet-manager-config
                  key: projectUID
            - name: FLEET_PROJECT_ROUTE
              valueFrom:
                configMapKeyRef:
                  name: fleet-manager-config
                  key: projectRoute
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: milo-kubeconfig
              mountPath: /var/run/fleet/milo
              readOnly: true
      volumes:
        - name: milo-kubeconfig
          secret:
            secretName: milo-configuration-kubeconfig
            defaultMode: 0440
            items:
              - key: value
                path: kubeconfig
