apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-manager
  namespace: fleet-system
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-manager
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: fleet-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/datum-cloud/fleet:latest
          imagePullPolicy: IfNotPresent
          # Projects come from discovery (every project with an Active metal
          # ServiceConsumer); see config/README.md. No provider or synthetic
          # integration is configured here, so lifecycle handlers stay
          # blocked and only requested hardware is resolved.
          args:
            - --config=/etc/fleet/manager/config.yaml
            - --private-namespace=fleet-system-private
            - --leader-election-namespace=fleet-system
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/fleet/manager
              readOnly: true
            - name: milo-kubeconfig
              mountPath: /var/run/fleet/milo
              readOnly: true
            - name: project-kubeconfig
              mountPath: /var/run/fleet/projects
              readOnly: true
      # All three inputs are environment-owned and absent from this bundle.
      volumes:
        - name: config
          configMap:
            name: fleet-manager-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: milo-kubeconfig
          secret:
            secretName: milo-configuration-kubeconfig
            defaultMode: 0440
            items:
              - key: value
                path: kubeconfig
        - name: project-kubeconfig
          secret:
            secretName: fleet-manager-project-kubeconfig
            defaultMode: 0440
            items:
              - key: value
                path: kubeconfig
