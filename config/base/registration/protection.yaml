apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleet-registration-ledger-protection
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: registration-ledger
      expression: request.namespace == 'fleet-system-private' && request.name == 'fleet-capacity-registration-v1'
  validations:
    - expression: request.operation == 'UPDATE' && request.userInfo.username == 'system:serviceaccount:fleet-system:fleet-registration'
      message: Registration reservations are retained; only the registration service may update this ledger.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleet-registration-ledger-protection
spec:
  policyName: fleet-registration-ledger-protection
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleet-registration-namespace-protection
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [DELETE]
        resources: [namespaces]
  validations:
    - expression: request.name != 'fleet-system-private'
      message: The private registration namespace contains permanent reservations and cannot be deleted.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleet-registration-namespace-protection
spec:
  policyName: fleet-registration-namespace-protection
  validationActions: [Deny]
