apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-registration-ledger
  namespace: fleet-system-private
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [fleet-capacity-registration-v1]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-registration-ledger
  namespace: fleet-system-private
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-registration-ledger
subjects:
  - kind: ServiceAccount
    name: fleet-registration
    namespace: fleet-system
