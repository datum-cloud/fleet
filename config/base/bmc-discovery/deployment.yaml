apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-bmc-discovery
spec:
  # Exactly one replica and no leader election: two replicas would each
  # contact every BMC and race on status. Recreate keeps a rollout from
  # briefly running two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-bmc-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-bmc-discovery
    spec:
      serviceAccountName: fleet-bmc-discovery
      # The token is needed to read credential Secrets in this namespace. Set
      # localKubeconfig in the config and turn this off to use a mounted
      # kubeconfig instead.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bmc-discovery
          image: ghcr.io/datum-cloud/fleet:latest
          command: [/fleet-bmc-discovery]
          args:
            - --config=/etc/fleet/bmc-discovery/config.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /etc/fleet/bmc-discovery, readOnly: true}
            - {name: milo, mountPath: /var/run/fleet/milo, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: fleet-bmc-discovery-config
        # A kubeconfig for the one Milo project, bound to the
        # fleet.datumapis.com-inventory-discoverer role. Environment-owned.
        - name: milo
          secret:
            secretName: fleet-bmc-discovery-milo-kubeconfig
            defaultMode: 0440
            items: [{key: kubeconfig, path: kubeconfig}]
