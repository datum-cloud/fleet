apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-bmc-discovery
---
# Reads credential Secrets in its own namespace only. Kubernetes RBAC cannot
# narrow this to the labelled Secrets, so keep discovery in a namespace that
# holds nothing else it should not read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-bmc-discovery-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-bmc-discovery-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-bmc-discovery-credentials
subjects:
  - kind: ServiceAccount
    name: fleet-bmc-discovery
