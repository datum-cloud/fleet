apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-bmc-discovery
---
# Lists and watches credential Secrets in its own namespace; discovery never
# gets one by name. Kubernetes RBAC cannot narrow this to the labelled
# Secrets, so keep discovery in a namespace that holds credential Secrets
# only. hack/validate-bmc-credential-namespace.sh checks every render here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-bmc-discovery-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-bmc-discovery-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-bmc-discovery-credentials
subjects:
  - kind: ServiceAccount
    name: fleet-bmc-discovery
