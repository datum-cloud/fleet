apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machines.metal.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: metal.datumapis.com
  names: {kind: Machine, listKind: MachineList, plural: machines, singular: machine}
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: Location, type: string, jsonPath: .spec.locationRef.name}
    - {name: Requested CPU, type: integer, jsonPath: .status.requestedHardware.cpu.cores, description: Exact physical cores pinned from the MachineProfile}
    - {name: Requested Memory, type: string, jsonPath: .status.requestedHardware.memory.capacity, description: Exact installed memory pinned from the MachineProfile}
    - {name: Network, type: string, jsonPath: '.status.network.interfaces[0].network.name'}
    - {name: Address, type: string, jsonPath: '.status.network.interfaces[0].addresses[?(@.primary==true)].address'}
    - {name: Profile, type: string, priority: 1, jsonPath: .spec.machineProfileRef.name}
    - {name: Allocated CPU, type: integer, priority: 1, jsonPath: .status.allocatedHardware.hardware.cpu.cores, description: Physical cores of the assigned hardware}
    - {name: Allocated Memory, type: string, priority: 1, jsonPath: .status.allocatedHardware.hardware.memory.capacity, description: Installed memory of the assigned hardware}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            required: [machineClassRef, machineProfileRef, locationRef]
            x-kubernetes-validations:
            - rule: >-
                self.machineClassRef == oldSelf.machineClassRef &&
                self.machineProfileRef == oldSelf.machineProfileRef &&
                self.locationRef == oldSelf.locationRef &&
                ((!has(self.initialInstallationRef) && !has(oldSelf.initialInstallationRef)) ||
                 (has(self.initialInstallationRef) && has(oldSelf.initialInstallationRef) &&
                  self.initialInstallationRef == oldSelf.initialInstallationRef)) &&
                ((!has(self.networkInterfaces) && !has(oldSelf.networkInterfaces)) ||
                 (has(self.networkInterfaces) && has(oldSelf.networkInterfaces) &&
                  self.networkInterfaces == oldSelf.networkInterfaces))
              message: allocation inputs are immutable
            - rule: >-
                (!has(self.creator) && !has(oldSelf.creator)) ||
                (has(self.creator) && has(oldSelf.creator) && self.creator == oldSelf.creator)
              message: creator is immutable
            properties:
              creator:
                type: object
                description: The authenticated caller that created the Machine. Admission sets it; clients cannot choose it.
                required: [username, uid]
                properties:
                  username: {type: string, minLength: 1}
                  uid: {type: string, minLength: 1}
              machineClassRef: {type: object, required: [name], properties: {name: {type: string}}}
              machineProfileRef: {type: object, required: [name], properties: {name: {type: string}}}
              locationRef: {type: object, required: [name], properties: {name: {type: string}}}
              initialInstallationRef: {type: object, properties: {name: {type: string}}}
              networkInterfaces:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name, network]
                  properties:
                    name: {type: string, minLength: 1}
                    network:
                      type: object
                      required: [name]
                      properties: {namespace: {type: string}, name: {type: string}}
                    ipFamilies:
                      type: array
                      maxItems: 2
                      x-kubernetes-list-type: set
                      items: {type: string, enum: [IPv4, IPv6]}
                      default: [IPv6]
                    addresses:
                      type: array
                      maxItems: 4
                      items:
                        type: object
                        required: [classRef]
                        properties:
                          classRef:
                            type: object
                            required: [name]
                            properties: {name: {type: string, minLength: 1}}
                    reclaimPolicy: {type: string, enum: [Delete, Retain], default: Delete}
              powerState: {type: string, enum: ["On", "Off"], default: "Off"}
          status:
            type: object
            x-kubernetes-validations:
            - rule: '!has(oldSelf.requestedHardware) || (has(self.requestedHardware) && self.requestedHardware == oldSelf.requestedHardware)'
              message: requestedHardware is pinned once accepted and cannot be changed or removed
            properties:
              phase: {type: string}
              placement:
                type: object
                required: [locationRef]
                properties:
                  locationRef:
                    type: object
                    required: [name]
                    properties: {name: {type: string}}
              acceptedProfileRef:
                type: object
                required: [name]
                properties: {name: {type: string}}
              # Controller-maintained exact request resolved from the profile.
              # Absent until resolved; immutable after acceptance.
              requestedHardware:
                type: object
                required: [cpu, memory, source]
                properties:
                  cpu:
                    type: object
                    required: [architecture, cores]
                    properties:
                      architecture: {type: string, minLength: 1, maxLength: 63}
                      cores: {type: integer, format: int64, minimum: 1}
                  memory:
                    type: object
                    required: [capacity]
                    properties:
                      capacity:
                        type: string
                        maxLength: 63
                        pattern: '^[1-9][0-9]*(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                  source:
                    type: object
                    required: [machineGeneration, profileRef, profileGeneration, profileDigest]
                    properties:
                      machineGeneration: {type: integer, format: int64, minimum: 1}
                      profileRef:
                        type: object
                        required: [name]
                        properties: {name: {type: string, minLength: 1, maxLength: 253}}
                      profileGeneration: {type: integer, format: int64, minimum: 1}
                      profileDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$', maxLength: 71}
              allocatedHardware:
                type: object
                required: [hardware]
                properties:
                  observedAt: {type: string, format: date-time}
                  hardware: {type: object, x-kubernetes-preserve-unknown-fields: true}
              currentInstallationRef:
                type: object
                required: [name]
                properties: {name: {type: string}}
              network:
                type: object
                properties:
                  revision: {type: string}
                  interfaces:
                    type: array
                    items: {type: object, x-kubernetes-preserve-unknown-fields: true}
              power:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: ["On", "Off", Unknown]}
              conditions:
                type: array
                items: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineallocations.metal.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: metal.datumapis.com
  names: {kind: MachineAllocation, listKind: MachineAllocationList, plural: machineallocations, singular: machineallocation, shortNames: [malloc]}
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: Machine, type: string, jsonPath: .spec.machineRef.name}
    - {name: Capacity, type: string, jsonPath: .spec.machineCapacityRef.name}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            required: [consumerRef, machineRef, machineCapacityRef, deviceRef, accepted, hardware, authority, cleaningPolicyDigest, bootInterface, targetDisks]
            x-kubernetes-validations:
            - {rule: 'self == oldSelf', message: MachineAllocation identity and endpoints are immutable}
            properties:
              # No spec holds an object UID. The allocation's name hashes the
              # consumer and Machine UIDs, and its labels record them.
              consumerRef:
                type: object
                required: [kind, name]
                x-kubernetes-validations:
                - rule: '(self.kind == "Project" && has(self.apiGroup) && self.apiGroup == "resourcemanager.miloapis.com") || (self.kind == "Namespace" && (!has(self.apiGroup) || self.apiGroup == ""))'
                  message: a consumer is a Milo Project or a standalone Namespace
                properties:
                  apiGroup: {type: string}
                  kind: {type: string, minLength: 1}
                  name: {type: string, minLength: 1}
              machineRef:
                type: object
                required: [namespace, name]
                properties:
                  namespace: {type: string, minLength: 1}
                  name: {type: string, minLength: 1}
              machineCapacityRef:
                type: object
                required: [namespace, name]
                properties:
                  namespace: {type: string, minLength: 1}
                  name: {type: string, minLength: 1}
              deviceRef:
                type: object
                required: [name]
                properties:
                  name: {type: string, minLength: 1}
              accepted:
                type: object
                required: [machineClassRef, machineProfileRef, cpu, memory]
                properties:
                  machineClassRef:
                    type: object
                    required: [name, generation, digest]
                    properties:
                      name: {type: string, minLength: 1}
                      generation: {type: integer, format: int64, minimum: 1}
                      digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
                  machineProfileRef:
                    type: object
                    required: [name, generation, digest]
                    properties:
                      name: {type: string, minLength: 1}
                      generation: {type: integer, format: int64, minimum: 1}
                      digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
                  cpu:
                    type: object
                    required: [architecture, cores]
                    properties:
                      architecture: {type: string, minLength: 1, maxLength: 63}
                      cores: {type: integer, format: int64, minimum: 1}
                  memory:
                    type: object
                    required: [capacity]
                    properties:
                      capacity: {type: string, minLength: 1}
              hardware: {type: object, x-kubernetes-preserve-unknown-fields: true}
              authority:
                type: object
                required: [principal, decision]
                properties:
                  principal: {type: string, minLength: 1, maxLength: 253}
                  decision: {type: string, minLength: 1, maxLength: 253}
              quotaClaimRef:
                type: object
                required: [name]
                properties:
                  name: {type: string, minLength: 1}
              cleaningPolicyDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
              bootInterface: {type: string, minLength: 1, maxLength: 63}
              targetDisks:
                type: array
                minItems: 1
                maxItems: 16
                items: {type: string, minLength: 1, maxLength: 63}
          status:
            type: object
            x-kubernetes-validations:
            - rule: "!has(oldSelf.phase) || oldSelf.phase != 'Released' || self.phase == 'Released'"
              message: a released MachineAllocation is terminal
            properties:
              phase: {type: string, enum: [Pending, Active, Releasing, Released, Unknown]}
              wipe:
                type: object
                required: [name, step]
                properties:
                  name: {type: string, minLength: 1}
                  step: {type: integer, format: int32, minimum: 1}
              conditions:
                type: array
                items: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: installations.metal.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: metal.datumapis.com
