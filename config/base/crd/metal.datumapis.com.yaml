apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineclasses.metal.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: metal.datumapis.com
  names: {kind: MachineClass, listKind: MachineClassList, plural: machineclasses, singular: machineclass, shortNames: [mc]}
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            x-kubernetes-validations:
            - rule: >-
                (has(self.source) && !has(self.profilePolicy) && !has(self.access) && !has(self.capacity)) ||
                (!has(self.source) && has(self.profilePolicy) && has(self.capacity))
              message: a class must be either a source reference or a provider definition
            - rule: >-
                has(self.source) == has(oldSelf.source) &&
                (!has(self.source) || self.source == oldSelf.source)
              message: class mode and source are immutable
            properties:
              source:
                type: object
                required: [publisherRef, name]
                properties:
                  publisherRef:
                    type: object
                    required: [kind, name]
                    x-kubernetes-validations:
                    - rule: '(self.kind == "Project" && has(self.apiGroup) && self.apiGroup == "resourcemanager.miloapis.com") || (self.kind == "Namespace" && (!has(self.apiGroup) || self.apiGroup == ""))'
                      message: a publisher is a Milo Project or a standalone Namespace
                    properties:
                      apiGroup: {type: string}
                      kind: {type: string, minLength: 1}
                      name: {type: string, minLength: 1}
                  name: {type: string, minLength: 1}
              profilePolicy: {type: object, x-kubernetes-preserve-unknown-fields: true}
              access: {type: object, x-kubernetes-preserve-unknown-fields: true}
              capacity: {type: object, x-kubernetes-preserve-unknown-fields: true}
          status:
            type: object
            properties:
              evaluatedRevision: {type: string}
              resolvedClass: {type: object, x-kubernetes-preserve-unknown-fields: true}
              conditions:
                type: array
                items: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineprofiles.metal.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: metal.datumapis.com
  names: {kind: MachineProfile, listKind: MachineProfileList, plural: machineprofiles, singular: machineprofile, shortNames: [mp]}
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Architecture, type: string, jsonPath: .spec.cpu.architecture}
    - {name: CPU, type: integer, jsonPath: .spec.cpu.cores}
    - {name: Memory, type: string, jsonPath: .spec.memory.capacity}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            x-kubernetes-validations:
            - {rule: 'self == oldSelf', message: MachineProfile requirements are immutable}
            required: [cpu, memory]
            properties:
              # CPU and memory are exact requests; min, max, and ranges are not
              # part of the contract. Cores counts physical cores across sockets.
              cpu:
                type: object
                required: [architecture, cores]
                properties:
                  architecture: {type: string, minLength: 1, maxLength: 63}
                  cores: {type: integer, format: int64, minimum: 1}
              # Installed RAM as a positive integer byte quantity, such as 32Gi.
              memory:
                type: object
                required: [capacity]
                properties:
                  capacity:
                    type: string
                    maxLength: 63
                    pattern: '^[1-9][0-9]*(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
              gpus:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              disks:
                type: array
                items: {type: object, x-kubernetes-preserve-unknown-fields: true}
              interfaces:
                type: array
                items: {type: object, x-kubernetes-preserve-unknown-fields: true}
          status:
            type: object
            properties:
              conditions:
                type: array
                items: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
