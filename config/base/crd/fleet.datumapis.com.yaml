apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineclasses.fleet.datumapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: fleet.datumapis.com
  names: {kind: MachineClass, listKind: MachineClassList, plural: machineclasses, singular: machineclass, shortNames: [mc]}
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            x-kubernetes-validations:
            - rule: >-
                (has(self.source) && !has(self.profilePolicy) && !has(self.access) && !has(self.capacity)) ||
                (!has(self.source) && has(self.profilePolicy) && has(self.capacity))
              message: a class must be either a source reference or a provider definition
            - rule: >-
                has(self.source) == has(oldSelf.source) &&
                (!has(self.source) || self.source == oldSelf.source)
              message: class mode and source are immutable
            properties:
              source:
                type: object
                required: [project, name]
                properties:
                  project: {type: string, minLength: 1}
                  name: {type: string, minLength: 1}
              profilePolicy: {type: object, x-kubernetes-preserve-unknown-fields: true}
              access: {type: object, x-kubernetes-preserve-unknown-fields: true}
              capacity: {type: object, x-kubernetes-preserve-unknown-fields: true}
          status:
            type: object
            properties:
              evaluatedRevision: {type: string}
              resolvedClass: {type: object, x-kubernetes-preserve-unknown-fields: true}
              conditions:
                type: array
                items: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
