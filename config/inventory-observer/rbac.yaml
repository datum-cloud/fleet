apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-inventory-observer
  namespace: fleet-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-inventory-observer
  namespace: fleet-system
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [inventoryobservations]
    verbs: [get, list]
  - apiGroups: [fleet.datumapis.com]
    resources: [inventoryobservations/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-inventory-observer
  namespace: fleet-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-inventory-observer
subjects:
  - kind: ServiceAccount
    name: fleet-inventory-observer
    namespace: fleet-system
