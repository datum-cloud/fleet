apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-inventory-observer
  namespace: fleet-system
  labels:
    app.kubernetes.io/name: fleet-inventory-observer
    app.kubernetes.io/component: inventory-observer
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fleet-inventory-observer
            app.kubernetes.io/component: inventory-observer
        spec:
          serviceAccountName: fleet-inventory-observer
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: observer
              image: ghcr.io/datum-cloud/fleet:latest
              imagePullPolicy: IfNotPresent
              command: [/fleet-inventory-observer]
              args:
                - --namespace=$(POD_NAMESPACE)
                - --netbox-url=$(NETBOX_URL)
                - --netbox-token-file=/var/run/fleet/netbox/token
                - --timeout=4m
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: NETBOX_URL
                  valueFrom:
                    configMapKeyRef:
                      name: fleet-inventory-observer
                      key: netboxURL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: netbox-token
                  mountPath: /var/run/fleet/netbox
                  readOnly: true
          volumes:
            - name: netbox-token
              secret:
                secretName: fleet-inventory-observer-netbox
                defaultMode: 0440
                items:
                  - key: token
                    path: token
