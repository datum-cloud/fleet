# Experimental handoff API: install on the Karmada API and participating cells.
# Never install in consumer project APIs. Payloads contain private authority.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineallocationhandoffs.coordination.fleet.datumapis.com
  annotations:
    # Deleting the CRD deletes every retained handoff. Never prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  group: coordination.fleet.datumapis.com
  scope: Namespaced
  names:
    plural: machineallocationhandoffs
    singular: machineallocationhandoff
    kind: MachineAllocationHandoff
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [cell, requestJSON]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Retained handoff intent is immutable
              properties:
                cell: {type: string, minLength: 1, maxLength: 63}
                requestJSON:
                  type: string
                  minLength: 1
                  maxLength: 1048576
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
