# Federation handoff API: install on the Karmada API and participating cells.
# Never install in consumer project APIs. A handoff carries one admitted
# operation's site assignment, or asks for a Device's fence report.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineallocationhandoffs.coordination.fleet.datumapis.com
  annotations:
    # Deleting the CRD deletes every retained handoff. Never prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  group: coordination.fleet.datumapis.com
  scope: Namespaced
  names:
    plural: machineallocationhandoffs
    singular: machineallocationhandoff
    kind: MachineAllocationHandoff
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [cell, device]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: A handoff is immutable
              properties:
                cell: {type: string, minLength: 1, maxLength: 63}
                # The Device as namespace/name in the provider project.
                device: {type: string, minLength: 3, maxLength: 317}
                # The exact assignment JSON; absent on a fence report request.
                assignmentJSON:
                  type: string
                  minLength: 1
                  maxLength: 65536
                # The Device's BMC credential Secret at the site, derived from
                # the Device; the assignment's worker may get only it.
                credential: {type: string, pattern: '^bmc-[a-f0-9]{20}$'}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
