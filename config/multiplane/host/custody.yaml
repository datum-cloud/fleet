# Private allocation custody on the management host API. Only the shared
# lifecycle coordinator's custodian identity may read or write these Secrets;
# its token is minted by bootstrap and never stored in the source.
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-system-private
  annotations:
    # Holds retained allocation custody. Never garbage-collect it. Same name
    # and policy as the production manager's private namespace.
    kustomize.toolkit.fluxcd.io/prune: disabled
    fleet.datumapis.com/shared-with-standalone: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-custodian, namespace: fleet-system-private}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-custodian, namespace: fleet-system-private}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-custodian, namespace: fleet-system-private}
subjects:
  - {kind: ServiceAccount, name: fleet-custodian, namespace: fleet-system-private}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-custodian}
