apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-management, namespace: fleet-coordination}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-management, namespace: fleet-coordination}
rules:
  - apiGroups: [coordination.fleet.datumapis.com]
    resources: [machineallocationhandoffs]
    # patch marks a handoff's result answered; the spec stays immutable.
    verbs: [get, list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-management, namespace: fleet-coordination}
subjects:
  - {kind: ServiceAccount, name: fleet-management, namespace: fleet-coordination}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-management}
