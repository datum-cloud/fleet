# Milo project API "consumer-a": its own process, etcd, PVC and NodePort.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: milo-consumer-a
resources:
  - namespace.yaml
  - ../base
patches:
  - target: {kind: Service, name: milo-apiserver}
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30442
