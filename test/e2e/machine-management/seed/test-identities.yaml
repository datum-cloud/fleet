apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-authorized, namespace: default}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-viewer, namespace: default}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-authorized-claim-view, namespace: default}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleet-machineclaim-viewer}
subjects: [{kind: ServiceAccount, name: fleet-authorized, namespace: default}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-viewer-claim-view, namespace: default}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleet-machineclaim-viewer}
subjects: [{kind: ServiceAccount, name: fleet-viewer, namespace: default}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-authorized-machine-management, namespace: default}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleet-machine-management-session-creator}
subjects: [{kind: ServiceAccount, name: fleet-authorized, namespace: default}]
