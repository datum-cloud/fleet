<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title description">
  <title id="title">BMC hardware telemetry data flow</title>
  <desc id="description">Fleet inventory supplies one snapshot of BMC addresses, telemetry accounts, and device identity to a renderer in the site BMC gateway pod. The renderer writes the exporter's per-host configuration and serves the scraper a target list with device labels. The exporter queries server BMCs over Redfish through the gateway VPN tunnel into the out-of-band network. The scraper in the site cell cluster scrapes the exporter and remote-writes to the platform metrics store for the operator view. Fleet publishes an allocation info series only while an allocation is active. A recording rule joins hardware series to it and adds the project label. An allowlist federation copies only joined series with allowed labels into the tenant metrics store, which tenants reach through the project-scoped query API or export to their own backend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    .heading { font-size: 24px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .detail { font-size: 17px; fill: #475569; }
    .edge { font-size: 17px; fill: #334155; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
  </style>
