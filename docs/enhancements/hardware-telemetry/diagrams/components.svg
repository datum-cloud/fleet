<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="850" viewBox="0 0 1430 850" role="img" aria-labelledby="title description">
  <title id="title">Systems involved in BMC hardware telemetry</title>
  <desc id="description">Systems grouped by owner and by trust boundary. The physical site holds servers, their BMCs, and later PDUs on the out-of-band network. Fleet provides BMC discovery, an operations custody record, inventory, and new pieces: telemetry account provisioning, a renderer with a target list, and an allocation info publisher. The BMC gateway holds the VPN tunnel into the out-of-band network and runs the adopted upstream Redfish exporter, and later an SNMP exporter. Account provisioning changes BMC accounts as a custody operation that goes through the gateway. The existing platform telemetry path has a scraper and the metrics store, plus a new recording rule and federation allowlist, all in the operator-only area. The tenant-visible area holds the tenant metrics store, query API, and export policy. Tenants use their own tools and their own backend.</desc>
