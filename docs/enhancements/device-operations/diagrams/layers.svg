<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
<title id="title">Every effect on a server passes through its custody record</title><desc id="description">The consumer project holds the Machine and Installation. The Fleet provider for Metal turns them into typed Device operations in the provider project, and staff create preparation and power operations there too. The Fleet coordinator admits each operation by updating the Device's custody record, which names the holder, the fence, and the active operation. The coordinator delivers admitted operations to the site that serves the Device. The site executor reads the Device's BMC credential, checks the key pin, acts on the BMC and boot network, and returns local results. Only the coordinator writes custody and operation status.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 22px; font-weight: 700; } .label { font-size: 19px; font-weight: 700; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
