<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title description">
<title id="title">Every effect on a server passes through its custody record</title><desc id="description">Three requesters create Device operations in the provider project: the Fleet provider for Metal, from Machines and Installations; the release controller, from deleted Machines; and staff. The Fleet coordinator admits each operation by updating the server's DeviceCustody, which names the holder, the fence, and the active operation, and refers to the Device. The coordinator delivers the admitted operation with its fence to the site executor, which acts on the BMC and boot network and returns results.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 22px; font-weight: 700; } .label { font-size: 19px; font-weight: 700; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="460" fill="white"/>
<rect x="20" y="20" width="250" height="420" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="145" y="55" class="heading" text-anchor="middle">Requesters</text>
<rect x="320" y="20" width="370" height="420" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="505" y="55" class="heading" text-anchor="middle">Provider project</text>
<rect x="740" y="20" width="200" height="420" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="840" y="55" class="heading" text-anchor="middle">Site</text>
<rect x="40" y="85" width="210" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="145" y="115" class="label" text-anchor="middle">Fleet provider</text>
<text x="145" y="140" class="detail" text-anchor="middle">Metal requests</text>
<rect x="40" y="215" width="210" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="145" y="245" class="label" text-anchor="middle">Release controller</text>
<text x="145" y="270" class="detail" text-anchor="middle">Deleted Machines</text>
<rect x="40" y="335" width="210" height="75" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="145" y="365" class="label" text-anchor="middle">Staff</text>
<text x="145" y="390" class="detail" text-anchor="middle">Commission, power</text>
<rect x="340" y="85" width="330" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="505" y="115" class="label" text-anchor="middle">Device operations</text>
<text x="505" y="140" class="detail" text-anchor="middle">Install, power, wipe, commission</text>
<rect x="340" y="215" width="330" height="75" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="505" y="245" class="label" text-anchor="middle">DeviceCustody</text>
<text x="505" y="270" class="detail" text-anchor="middle">Holder, fence, active operation</text>
<rect x="340" y="335" width="330" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="505" y="365" class="label" text-anchor="middle">Device</text>
<text x="505" y="390" class="detail" text-anchor="middle">Identity, BMC endpoint, NICs</text>
<rect x="760" y="215" width="160" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="840" y="245" class="label" text-anchor="middle">Executor</text>
<text x="840" y="270" class="detail" text-anchor="middle">One worker each</text>
<rect x="760" y="335" width="160" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="840" y="365" class="label" text-anchor="middle">BMC and</text>
<text x="840" y="390" class="label" text-anchor="middle">boot network</text>
