<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title description">
<title id="title">Network preparation and handoff</title><desc id="description">Fleet submits interface requirements to NSO. Allocated addresses and prepared configuration allow installation to proceed. Handoff requires networking Programmed evidence and a verified installation when one is requested. Allocation-only handoff requires no Installation. Programming can finish before installation; this is a dependency view, not a wiring procedure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="620" fill="white"/>
<rect x="55" y="20" width="210" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="160.0" y="53.0" class="heading" text-anchor="middle">Fleet coordinator</text>
<path d="M 160 74 L 160 525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="375" y="20" width="210" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="480.0" y="53.0" class="heading" text-anchor="middle">NSO / networking</text>
<path d="M 480 74 L 480 525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="695" y="20" width="210" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="800" y="41" class="heading" text-anchor="middle">Installation</text>
<text x="800" y="64" class="heading" text-anchor="middle">executor</text>
<path d="M 800 74 L 800 525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="320.0" y="105" class="label" text-anchor="middle">Request interface</text>
<text x="320.0" y="128" class="label" text-anchor="middle">on the existing Network</text>
<path d="M 160 140 L 480 140" class="line"/>
<text x="320.0" y="190" class="label" text-anchor="middle">Allocated addresses</text>
<text x="320.0" y="213" class="label" text-anchor="middle">and Prepared configuration</text>
<path d="M 480 225 L 160 225" class="line" stroke-dasharray="5 4"/>
<text x="480.0" y="293" class="label" text-anchor="middle">If requested: admit installation with retained network inputs</text>
<path d="M 160 305 L 800 305" class="line"/>
<text x="480.0" y="373" class="label" text-anchor="middle">Verified installation outcome</text>
<path d="M 800 385 L 160 385" class="line" stroke-dasharray="5 4"/>
<text x="320.0" y="430" class="label" text-anchor="middle">Programmed evidence</text>
<text x="320.0" y="453" class="label" text-anchor="middle">for the accepted binding</text>
<path d="M 480 465 L 160 465" class="line" stroke-dasharray="5 4"/>
<rect x="30" y="550" width="900" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480.0" y="582.0" class="label" text-anchor="middle">Handoff waits for requested installation and network readiness.</text>
</svg>
