<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title description">
  <title id="title">Private records retain the cross-project binding</title>
  <desc id="description">Outside both project deletion domains, Fleet stores a reservation that retains the consumer claim identity, accepted class and profile contracts, and provider machine identity. An operation record references that reservation by binding ID and epoch. Each retained resource identity includes its ProjectKey and resource UID.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    .heading { font-size: 24px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .detail { font-size: 17px; fill: #475569; }
    .edge { font-size: 17px; fill: #334155; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="330" fill="white"/>
  <rect x="280" y="16" width="400" height="298" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="51" class="heading" text-anchor="middle">Fleet private storage</text>
  <text x="480" y="77" class="detail" text-anchor="middle">Survives project deletion</text>
  <text x="128" y="77" class="detail" text-anchor="middle">Consumer project</text>
  <text x="832" y="77" class="detail" text-anchor="middle">Provider project</text>
  <rect x="24" y="105" width="208" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="128.0" y="148" class="label" text-anchor="middle">MachineClaim</text>
  <rect x="728" y="105" width="208" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="832.0" y="148" class="label" text-anchor="middle">Machine</text>
  <rect x="348" y="105" width="264" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480.0" y="134" class="label" text-anchor="middle">Reservation</text>
  <text x="480.0" y="158" class="detail" text-anchor="middle">Binding and accepted contracts</text>
  <path d="M 348 141 L 232 141" class="line"/>
  <path d="M 612 141 L 728 141" class="line"/>
  <rect x="348" y="226" width="264" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480.0" y="255" class="label" text-anchor="middle">Operation</text>
  <text x="480.0" y="279" class="detail" text-anchor="middle">Exact plan and authority</text>
  <path d="M 480 226 L 480 177" class="line"/>
  <text x="492" y="206" class="edge" text-anchor="start">binding + epoch</text>
</svg>
