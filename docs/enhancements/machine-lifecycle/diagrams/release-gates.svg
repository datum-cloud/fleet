<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
<title id="title">Release gates and quarantine</title><desc id="description">Release closes admission, settles or fences operations, revokes issued access, detaches or fences networking and settles address obligations, verifies cleaning, and waits for quota release acknowledgment. The provider project retains the reservation and operation records throughout release. Unknown obligations quarantine capacity and block provider-project deletion. Released capacity still needs fresh eligibility evidence before reuse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="800" fill="white"/>
<rect x="22" y="50" width="570" height="558" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="307" y="32" class="heading" text-anchor="middle">Provider-held release obligations</text>
<rect x="42" y="72" width="530" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="307.0" y="104.5" class="label" text-anchor="middle">Close admission</text>
<text x="307.0" y="127.5" class="label" text-anchor="middle">Settle active operations or fence their executors</text>
<path d="M 307 148 L 307 177" class="line"/>
<rect x="42" y="177" width="530" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="307.0" y="209.5" class="label" text-anchor="middle">Revoke issued access</text>
<text x="307.0" y="232.5" class="label" text-anchor="middle">Artifacts, bootstrap access, credentials, and sessions</text>
<path d="M 307 253 L 307 282" class="line"/>
<rect x="42" y="282" width="530" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="307.0" y="314.5" class="label" text-anchor="middle">Detach or fence networking</text>
<text x="307.0" y="337.5" class="label" text-anchor="middle">Settle address release or retention obligations</text>
<path d="M 307 358 L 307 387" class="line"/>
<rect x="42" y="387" width="530" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="307.0" y="419.5" class="label" text-anchor="middle">Execute the retained cleaning policy</text>
<text x="307.0" y="442.5" class="label" text-anchor="middle">Verify every target; record CleanupVerified</text>
<path d="M 307 463 L 307 492" class="line"/>
<rect x="42" y="492" width="530" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="307.0" y="524.5" class="label" text-anchor="middle">Release quota idempotently</text>
<text x="307.0" y="547.5" class="label" text-anchor="middle">Wait for acknowledgment</text>
<rect x="644" y="235" width="294" height="160" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="791.0" y="286.5" class="label" text-anchor="middle">Unverified → Quarantined</text>
<text x="791.0" y="309.5" class="label" text-anchor="middle">Keep capacity unavailable.</text>
<text x="791.0" y="332.5" class="label" text-anchor="middle">Retain the binding and</text>
<text x="791.0" y="355.5" class="label" text-anchor="middle">unsettled quota custody.</text>
<path d="M 592 315 L 644 315" class="line"/>
<path d="M 790 235 L 790 140 L 592 140" class="line" stroke-dasharray="5 4"/>
<text x="790" y="110" class="detail" text-anchor="middle">Verified recovery</text>
<text x="790" y="133" class="detail" text-anchor="middle">resumes release</text>
<path d="M 307 568 L 307 646" class="line"/>
<rect x="42" y="646" width="530" height="76" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="307.0" y="678.5" class="label" text-anchor="middle">Commit Released</text>
<text x="307.0" y="701.5" class="label" text-anchor="middle">Fresh eligibility evidence is required before reuse.</text>
<text x="480" y="773" class="detail" text-anchor="middle">Provider-project deletion also requires retired authority and satisfied history retention.</text>
</svg>
