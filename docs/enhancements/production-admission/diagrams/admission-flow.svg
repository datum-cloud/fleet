<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title description">
<title id="title">Machine admission from create through a fenced commit</title><desc id="description">A customer creates a Machine. Fleet's webhooks in the root API server record the caller as the creator, add the protection finalizer, and check the caller's access. The allocator reads the project fence generation, checks admission for the retained creator, and creates the MachineAllocation as Pending at that generation. It reads the fence again and, if unchanged, moves the allocation to Admitted with a conditional update, then claims Device custody. When an invalidation raises the fence, the fence controller deletes every Pending allocation recorded at an older generation with a conditional delete, then acknowledges the new generation. One conditional write on the allocation decides each race.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 19px; font-weight: 700; } .label { font-size: 17px; } .detail { font-size: 16px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="1240" height="760" fill="white"/>
<rect x="30" y="20" width="180" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="120" y="53" class="heading" text-anchor="middle">Customer</text>
<path d="M 120 74 L 120 740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="230" y="20" width="180" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="320" y="42" class="heading" text-anchor="middle">Fleet webhooks</text>
<text x="320" y="64" class="detail" text-anchor="middle">Root API server</text>
<path d="M 320 74 L 320 740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="430" y="20" width="180" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="520" y="53" class="heading" text-anchor="middle">Allocator</text>
<path d="M 520 74 L 520 740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="630" y="20" width="180" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="720" y="42" class="heading" text-anchor="middle">MachineAllocation</text>
<text x="720" y="64" class="detail" text-anchor="middle">One per Machine</text>
<path d="M 720 74 L 720 740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="830" y="20" width="180" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="920" y="42" class="heading" text-anchor="middle">Project fence</text>
<text x="920" y="64" class="detail" text-anchor="middle">Owned by Milo</text>
<path d="M 920 74 L 920 740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="1030" y="20" width="180" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="1120" y="53" class="heading" text-anchor="middle">Fence controller</text>
<path d="M 1120 74 L 1120 740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="220.0" y="128" class="label" text-anchor="middle">Create Machine</text>
<path d="M 120 140 L 320 140" class="line"/>
<text x="320" y="170" class="detail" text-anchor="middle">Set creator, add</text>
<text x="320" y="193" class="detail" text-anchor="middle">finalizer, review access</text>
<text x="720.0" y="248" class="label" text-anchor="middle">Read generation G</text>
<path d="M 520 260 L 920 260" class="line"/>
<text x="520" y="290" class="detail" text-anchor="middle">Check admission</text>
<text x="520" y="313" class="detail" text-anchor="middle">for the creator</text>
<text x="620.0" y="368" class="label" text-anchor="middle">Create Pending at G</text>
<path d="M 520 380 L 720 380" class="line"/>
<text x="720.0" y="438" class="label" text-anchor="middle">Read again: still G?</text>
<path d="M 520 450 L 920 450" class="line"/>
<text x="620.0" y="485" class="label" text-anchor="middle">Pending to Admitted,</text>
<text x="620.0" y="508" class="label" text-anchor="middle">conditional</text>
<path d="M 520 520 L 720 520" class="line"/>
<text x="520" y="550" class="detail" text-anchor="middle">Then claim custody</text>
<text x="1020.0" y="608" class="label" text-anchor="middle">Generation raised</text>
<path d="M 920 620 L 1120 620" class="line" stroke-dasharray="5 4"/>
<text x="920.0" y="645" class="label" text-anchor="middle">Delete older Pending,</text>
<text x="920.0" y="668" class="label" text-anchor="middle">conditional</text>
<path d="M 1120 680 L 720 680" class="line"/>
<text x="1020.0" y="723" class="label" text-anchor="middle">Acknowledge</text>
<path d="M 1120 735 L 920 735" class="line"/>
</svg>
