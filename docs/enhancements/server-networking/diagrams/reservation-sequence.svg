<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="961" viewBox="0 0 1000 961" role="img" aria-labelledby="title description">
<title id="title">A reservation exists only while its operation runs</title><desc id="description">The requester claims a provisioning address from IPAM and creates the operation with the address. The coordinator checks the claim at admission and delivers the operation with the boot NIC MAC from Device inventory. The site adds the reservation to its feed. The synchronizer applies it to Kea and reports it applied. Only then does the site power on the server, whose firmware gets the address through the relay. When the boot closes, the reservation leaves the feed, the synchronizer reports it withdrawn, and the operation succeeds. The requester then deletes the address claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 19px; font-weight: 700; } .label { font-size: 17px; } .detail { font-size: 16px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="1000" height="961" fill="white"/>

<rect x="18" y="20" width="147" height="58" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="92" y="44" class="heading" text-anchor="middle">Requester</text>
<text x="92" y="67" class="detail" text-anchor="middle">Provider, release</text>
<path d="M 92 78 L 92 951" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="181" y="20" width="147" height="58" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="255" y="55" class="heading" text-anchor="middle">IPAM</text>
<path d="M 255 78 L 255 951" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="345" y="20" width="147" height="58" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="418" y="55" class="heading" text-anchor="middle">Coordinator</text>
<path d="M 418 78 L 418 951" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="508" y="20" width="147" height="58" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="582" y="44" class="heading" text-anchor="middle">Site</text>
<text x="582" y="67" class="detail" text-anchor="middle">Feed, worker</text>
<path d="M 582 78 L 582 951" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="671" y="20" width="147" height="58" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="745" y="44" class="heading" text-anchor="middle">Synchronizer</text>
<text x="745" y="67" class="detail" text-anchor="middle">Kea</text>
<path d="M 745 78 L 745 951" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="835" y="20" width="147" height="58" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="908" y="44" class="heading" text-anchor="middle">Server</text>
<text x="908" y="67" class="detail" text-anchor="middle">Firmware</text>
<path d="M 908 78 L 908 951" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="173" y="110" class="label" text-anchor="middle">Claim address</text>
<path d="M 92 122 L 255 122" class="line"/>
<text x="173" y="166" class="label" text-anchor="middle">Host address</text>
<path d="M 255 178 L 92 178" class="line" stroke-dasharray="5 4"/>
<text x="255" y="222" class="label" text-anchor="middle">Operation with</text>
<text x="255" y="243" class="label" text-anchor="middle">address</text>
<path d="M 92 255 L 418 255" class="line"/>
<text x="500" y="299" class="label" text-anchor="middle">Admit; deliver with</text>
<text x="500" y="320" class="label" text-anchor="middle">boot NIC MAC</text>
<path d="M 418 332 L 582 332" class="line"/>
<text x="663" y="376" class="label" text-anchor="middle">Fetch feed</text>
<path d="M 745 388 L 582 388" class="line"/>
<text x="663" y="432" class="label" text-anchor="middle">NIC → address</text>
<path d="M 582 444 L 745 444" class="line" stroke-dasharray="5 4"/>
<text x="663" y="488" class="label" text-anchor="middle">Report applied</text>
<text x="663" y="509" class="label" text-anchor="middle">after Kea accepts</text>
<path d="M 745 521 L 582 521" class="line"/>
<text x="745" y="565" class="label" text-anchor="middle">Arm network boot,</text>
<text x="745" y="586" class="label" text-anchor="middle">power on</text>
<path d="M 582 598 L 908 598" class="line"/>
<text x="827" y="642" class="label" text-anchor="middle">DHCP through</text>
<text x="827" y="663" class="label" text-anchor="middle">the relay</text>
<path d="M 908 675 L 745 675" class="line"/>
<text x="582" y="719" class="detail" text-anchor="middle">Boot closes; the</text>
<text x="582" y="740" class="detail" text-anchor="middle">feed drops the NIC</text>
<text x="663" y="783" class="label" text-anchor="middle">Report withdrawn</text>
<path d="M 745 795 L 582 795" class="line"/>
<text x="500" y="839" class="label" text-anchor="middle">Succeeded</text>
<path d="M 582 851 L 418 851" class="line"/>
<text x="173" y="895" class="label" text-anchor="middle">Delete claim</text>
<path d="M 92 907 L 255 907" class="line"/>
</svg>
