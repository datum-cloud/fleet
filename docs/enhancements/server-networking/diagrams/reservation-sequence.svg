<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1192" viewBox="0 0 1120 1192" role="img" aria-labelledby="title description">
<title id="title">A reservation exists only while its operation runs</title><desc id="description">The requester makes a boot attachment claim in NSO and waits until NSO reports the boot port on the boot network. It then claims a provisioning address from IPAM and creates the operation with a typed reference to the claim and the address. The coordinator checks the claim at admission and delivers the operation with the boot NIC MAC from Device inventory. The site adds the reservation to its feed. The synchronizer applies it to Kea and reports it applied. Only then does the site power on the server, whose firmware gets the address through the relay. When the boot closes, the reservation leaves the feed, the synchronizer reports it withdrawn, and the operation succeeds. The requester then deletes the address claim and the boot attachment claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 19px; font-weight: 700; } .label { font-size: 17px; } .detail { font-size: 16px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
