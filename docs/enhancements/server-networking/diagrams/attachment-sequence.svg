<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1258" viewBox="0 0 1000 1258" role="img" aria-labelledby="title description">
<title id="title">A Machine interface from request to programmed switch port</title><desc id="description">The Fleet provider for Metal checks the Network and the caller, allocates a server, and creates an interface claim with the Physical attachment mode and the attachment point: the host MAC address and the switch port from inventory. NSO assigns addresses through IPAM and writes the interface. NSO's physical realizer checks that the port belongs to the allocation and reports the interface Prepared. Once no boot attachment claim names the port, it moves the switch port to the Network segment in one step and reports it Programmed. Fleet copies the addresses into Machine status and reports NetworkReady. On release, Fleet deletes the claim, the realizer moves the port from the segment, NSO returns the addresses, and the claim goes away, which closes the Network and Address gates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 19px; font-weight: 700; } .label { font-size: 17px; } .detail { font-size: 16px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
