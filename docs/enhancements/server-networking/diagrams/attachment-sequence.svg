<text x="892" y="55" class="heading" text-anchor="middle">Switch port</text>
<path d="M 892 78 L 892 1012" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="108" y="110" class="label" text-anchor="middle">Check Network,</text>
<text x="108" y="131" class="label" text-anchor="middle">caller; allocate</text>
