<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title description">
<title id="title">Who writes each network surface</title><desc id="description">Fleet writes the boot address claim and operation inputs, interface claims, and Machine network status. The site serves the reservation feed. IPAM assigns provisioning and customer addresses. NSO writes interfaces. The synchronizer is the only writer of Kea runtime configuration. Network operations owns Kea base configuration, relays, the provisioning VLAN, and each switch port base profile. The physical realizer is the only writer of a switch port customer network membership.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 19px; font-weight: 700; } .label { font-size: 17px; } .detail { font-size: 16px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
