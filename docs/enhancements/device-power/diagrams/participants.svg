<path d="M 620 88 L 620 114 L 470 114 L 470 140" class="line"/>
<rect x="230" y="260" width="420" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="440" y="289" class="label" text-anchor="middle">Custody admission and site execution</text>
<text x="440" y="313" class="detail" text-anchor="middle">Device operations proposal</text>
<path d="M 440 212 L 440 260" class="line"/>
<rect x="720" y="140" width="210" height="72" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="825" y="169" class="label" text-anchor="middle">BMC discovery</text>
<text x="825" y="193" class="detail" text-anchor="middle">Read-only</text>
<rect x="720" y="260" width="210" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="825" y="289" class="label" text-anchor="middle">Device</text>
<text x="825" y="313" class="detail" text-anchor="middle">Offered actions, power</text>
<path d="M 825 212 L 825 260" class="line"/>
<text x="837" y="242" class="edge" text-anchor="start">reports</text>
<path d="M 720 296 L 650 296" class="line"/>
<text x="685" y="284" class="edge" text-anchor="middle">gates</text>
<rect x="315" y="390" width="250" height="72" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="440" y="419" class="label" text-anchor="middle">Worker</text>
<text x="440" y="443" class="detail" text-anchor="middle">Checks power first</text>
