<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
<title id="title">What power adds to device operations</title><desc id="description">Staff, from the Device page with a required reason, and the Fleet provider for Metal, from a Machine's powerState, both create a DevicePowerOperation that names an action and the expected system UUID. Custody admission and site execution, defined in the device operations proposal, admit and deliver it. The Device's discovery facts, the offered power actions and the power state, gate admission. BMC discovery reads the BMC without changing it and reports those facts on the Device. The site worker checks the power state and sends at most one command to the BMC. A later discovery reading of the power state is the evidence that settles a power recovery hold.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .label { font-size: 20px; font-weight: 700; } .detail { font-size: 17px; fill: #475569; } .edge { font-size: 17px; fill: #334155; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="560" fill="white"/>
<rect x="120" y="16" width="280" height="72" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
