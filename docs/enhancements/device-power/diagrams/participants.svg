<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
<title id="title">Who takes part in a Device power operation</title><desc id="description">Staff, from the Device page with a required reason, and the Fleet provider for Metal, from a Machine's powerState, both create a DevicePowerOperation in the provider project. The Fleet coordinator in management admits the operation with a conditional update to the Device's custody, reads the Device's discovery facts, and is the only writer of operation status. It delivers the admitted operation to the site with the custody fence. In the site, one worker holds one Device's BMC credential, sends at most one command to the BMC, and returns a result carrying the fence. BMC discovery reads BMCs, never changes them, and writes the offered power actions and power state to Device status. Sites hold no credentials for project APIs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 24px; font-weight: 700; } .label { font-size: 20px; font-weight: 700; } .detail { font-size: 17px; fill: #475569; } .edge { font-size: 17px; fill: #334155; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
