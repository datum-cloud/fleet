<text x="452" y="368" class="edge" text-anchor="start">delivers</text>
<rect x="720" y="390" width="210" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="825" y="419" class="label" text-anchor="middle">BMC</text>
<text x="825" y="443" class="detail" text-anchor="middle">One per server</text>
<path d="M 565 426 L 720 426" class="line"/>
<text x="642" y="414" class="edge" text-anchor="middle">one command</text>
