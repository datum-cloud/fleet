<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title description">
<title id="title">What a site worker does for one power operation</title><desc id="description">The worker receives an admitted power operation with its admission time. It reads the offered power actions and the current power state from the BMC. Unless the server is already in the requested state, it sends one command. It then reads the power state until the requested state or reset evidence appears, or three minutes pass. It returns a result with the power state before and after. Before sending, the worker refuses with no command if it started more than two minutes after admission, if the system UUID differs, if the action is not offered, if a restart or power cycle targets a server that is off, or if the power state is still changing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="660" fill="white"/>
<rect x="50" y="20" width="220" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="160" y="42" class="heading" text-anchor="middle">Fleet coordinator</text>
<text x="160" y="64" class="detail" text-anchor="middle">Custody admission</text>
<path d="M 160 74 L 160 570" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="370" y="20" width="220" height="54" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="480" y="42" class="heading" text-anchor="middle">Worker</text>
<text x="480" y="64" class="detail" text-anchor="middle">Site</text>
<path d="M 480 74 L 480 570" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="690" y="20" width="220" height="54" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="800" y="53" class="heading" text-anchor="middle">BMC</text>
<path d="M 800 74 L 800 570" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="320" y="110" class="label" text-anchor="middle">Admitted operation,</text>
<text x="320" y="133" class="label" text-anchor="middle">with admission time</text>
<path d="M 160 145 L 480 145" class="line"/>
<text x="640" y="190" class="label" text-anchor="middle">Read offered actions</text>
<text x="640" y="213" class="label" text-anchor="middle">and power state</text>
<path d="M 480 225 L 800 225" class="line"/>
<text x="640" y="272" class="label" text-anchor="middle">Offered actions, power state</text>
<path d="M 800 284 L 480 284" class="line" stroke-dasharray="5 4"/>
<text x="640" y="320" class="label" text-anchor="middle">One command, unless</text>
<text x="640" y="343" class="label" text-anchor="middle">already in that state</text>
<path d="M 480 355 L 800 355" class="line"/>
<text x="640" y="400" class="label" text-anchor="middle">Power state and reset</text>
<text x="640" y="423" class="label" text-anchor="middle">time, for up to 3 minutes</text>
<path d="M 800 435 L 480 435" class="line" stroke-dasharray="5 4"/>
<text x="320" y="480" class="label" text-anchor="middle">Result, power before</text>
<text x="320" y="503" class="label" text-anchor="middle">and after</text>
<path d="M 480 515 L 160 515" class="line" stroke-dasharray="5 4"/>
<rect x="28" y="590" width="904" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="613" class="label" text-anchor="middle">No command if late, on a UUID mismatch, an action not offered,</text>
<text x="480" y="634" class="label" text-anchor="middle">a restart of an off server, or a power state still changing.</text>
</svg>
