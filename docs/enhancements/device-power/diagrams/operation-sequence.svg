<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title description">
<title id="title">One Device power operation from request to result</title><desc id="description">Staff create an operation in the provider project. The dispatcher checks the Device, its discovery and its capacity, then marks the operation Accepted. It marks the operation Executing, checks capacity again, and starts one worker. The worker checks the BMC's TLS key, the server's identity and the offered actions, then sends one command. It watches the power state, and reports the result to the dispatcher, which writes it to the operation. Staff read Succeeded, Failed or Unknown. A lost response is never resent, and an outcome Fleet cannot prove ends as Unknown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="880" fill="white"/>
<rect x="15" y="20" width="170" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="100" y="53" class="heading" text-anchor="middle">Staff</text>
<path d="M 100 74 L 100 790" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="205" y="20" width="170" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="290" y="42" class="heading" text-anchor="middle">Provider</text>
<text x="290" y="64" class="detail" text-anchor="middle">project</text>
<path d="M 290 74 L 290 790" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="395" y="20" width="170" height="54" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="480" y="53" class="heading" text-anchor="middle">Dispatcher</text>
<path d="M 480 74 L 480 790" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="585" y="20" width="170" height="54" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="670" y="53" class="heading" text-anchor="middle">Worker</text>
<path d="M 670 74 L 670 790" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="775" y="20" width="170" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="860" y="53" class="heading" text-anchor="middle">BMC</text>
<path d="M 860 74 L 860 790" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="195" y="128" class="label" text-anchor="middle">Create operation</text>
<path d="M 100 140 L 290 140" class="line"/>
<text x="385" y="180" class="label" text-anchor="middle">Checks pass:</text>
<text x="385" y="203" class="label" text-anchor="middle">mark Accepted</text>
<path d="M 480 215 L 290 215" class="line"/>
<text x="385" y="262" class="label" text-anchor="middle">Mark Executing</text>
<path d="M 480 274 L 290 274" class="line"/>
<text x="575" y="320" class="label" text-anchor="middle">Check capacity</text>
<text x="575" y="343" class="label" text-anchor="middle">again; start one</text>
<path d="M 480 355 L 670 355" class="line"/>
<text x="765" y="400" class="label" text-anchor="middle">Check TLS key,</text>
<text x="765" y="423" class="label" text-anchor="middle">identity, actions</text>
<path d="M 670 435 L 860 435" class="line"/>
<text x="765" y="482" class="label" text-anchor="middle">Send one command</text>
<path d="M 670 494 L 860 494" class="line"/>
<text x="765" y="541" class="label" text-anchor="middle">Power state</text>
<path d="M 860 553 L 670 553" class="line" stroke-dasharray="5 4"/>
<text x="575" y="600" class="label" text-anchor="middle">Result</text>
<path d="M 670 612 L 480 612" class="line" stroke-dasharray="5 4"/>
<text x="385" y="659" class="label" text-anchor="middle">Write result</text>
<path d="M 480 671 L 290 671" class="line"/>
<text x="195" y="718" class="label" text-anchor="middle">Read result</text>
<path d="M 290 730 L 100 730" class="line" stroke-dasharray="5 4"/>
<rect x="28" y="810" width="904" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="842" class="label" text-anchor="middle">A lost response is never resent. An outcome Fleet cannot prove ends as Unknown.</text>
</svg>
