<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title description">
<title id="title">One Device power operation from request to result</title><desc id="description">A requester, either staff or the Fleet provider for Metal, creates a power operation with an action and the expected system UUID. The Fleet coordinator checks the Device record: the offered actions, the system UUID, how recent discovery is, and whether the BMC's TLS key is shared. It then admits the operation through the Device's custody and delivers it to a site worker with the fence. The worker checks the BMC's key and the server's identity, reads the power state, sends one command, and reads the power state again. It returns a result with the fence. The coordinator writes the status and either releases custody or places a recovery hold. A worker that starts more than two minutes after admission refuses as Stale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="740" fill="white"/>
<rect x="15" y="20" width="170" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="100" y="53" class="heading" text-anchor="middle">Requester</text>
<path d="M 100 74 L 100 650" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="205" y="20" width="170" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="290" y="42" class="heading" text-anchor="middle">Fleet</text>
<text x="290" y="64" class="detail" text-anchor="middle">coordinator</text>
<path d="M 290 74 L 290 650" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="395" y="20" width="170" height="54" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="480" y="42" class="heading" text-anchor="middle">Device</text>
<text x="480" y="64" class="detail" text-anchor="middle">Discovery facts</text>
<path d="M 480 74 L 480 650" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="585" y="20" width="170" height="54" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="670" y="42" class="heading" text-anchor="middle">Worker</text>
<text x="670" y="64" class="detail" text-anchor="middle">Site</text>
<path d="M 670 74 L 670 650" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="775" y="20" width="170" height="54" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="860" y="53" class="heading" text-anchor="middle">BMC</text>
<path d="M 860 74 L 860 650" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="195" y="110" class="label" text-anchor="middle">Create: action,</text>
<text x="195" y="133" class="label" text-anchor="middle">expected UUID</text>
<path d="M 100 145 L 290 145" class="line"/>
<text x="385" y="180" class="label" text-anchor="middle">Offered action, UUID,</text>
<text x="385" y="203" class="label" text-anchor="middle">discovery age, key</text>
<path d="M 290 215 L 480 215" class="line"/>
<text x="480" y="262" class="label" text-anchor="middle">Admit through custody; deliver with fence</text>
<path d="M 290 274 L 670 274" class="line"/>
<text x="765" y="320" class="label" text-anchor="middle">Check key and</text>
<text x="765" y="343" class="label" text-anchor="middle">identity; read power</text>
<path d="M 670 355 L 860 355" class="line"/>
<text x="765" y="402" class="label" text-anchor="middle">Send one command</text>
<path d="M 670 414 L 860 414" class="line"/>
<text x="765" y="461" class="label" text-anchor="middle">Power state</text>
<path d="M 860 473 L 670 473" class="line" stroke-dasharray="5 4"/>
<text x="480" y="520" class="label" text-anchor="middle">Result with fence</text>
<path d="M 670 532 L 290 532" class="line" stroke-dasharray="5 4"/>
<text x="195" y="579" class="label" text-anchor="middle">Status; custody</text>
<text x="195" y="602" class="label" text-anchor="middle">released or held</text>
<path d="M 290 614 L 100 614" class="line" stroke-dasharray="5 4"/>
<rect x="28" y="670" width="904" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="702" class="label" text-anchor="middle">A late worker refuses as Stale. A lost response is never resent.</text>
</svg>
