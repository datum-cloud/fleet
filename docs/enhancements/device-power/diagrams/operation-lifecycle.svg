<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title description">
<title id="title">Device power operation lifecycle and outcomes</title><desc id="description">An operation is created with its spec fixed and its requester checked. The dispatcher either refuses it at acceptance, which ends as Failed with nothing sent, or marks it Accepted. An accepted operation moves to Executing, where one worker sends at most one command. A worker that stops before its command also ends as Failed. It finishes with one of three results. Succeeded means the requested power state or a reset was observed. Failed means Fleet knows nothing was sent, or the BMC refused and power did not change. Unknown means a command may have been sent and the outcome is unproven. The result is set once and never changes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="680" fill="white"/>
<rect x="42" y="40" width="500" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="292" y="72.5" class="label" text-anchor="middle">Created</text>
<text x="292" y="95.5" class="label" text-anchor="middle">Spec fixed; requester checked</text>
<path d="M 292 116 L 292 165" class="line"/>
<rect x="42" y="165" width="500" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="292" y="197.5" class="label" text-anchor="middle">Accepted</text>
<text x="292" y="220.5" class="label" text-anchor="middle">Every dispatcher check passed</text>
<path d="M 292 241 L 292 290" class="line"/>
<rect x="42" y="290" width="500" height="76" rx="8" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="292" y="322.5" class="label" text-anchor="middle">Executing</text>
<text x="292" y="345.5" class="label" text-anchor="middle">One worker; at most one command</text>
<rect x="622" y="165" width="300" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="772" y="197.5" class="label" text-anchor="middle">Refused at acceptance</text>
<text x="772" y="220.5" class="label" text-anchor="middle">Failed; nothing sent</text>
<path d="M 542 78 L 772 78 L 772 165" class="line"/>
<path d="M 292 366 L 292 420" stroke="#475569" stroke-width="2"/>
<path d="M 182 420 L 778 420" stroke="#475569" stroke-width="2" fill="none"/>
<text x="304" y="404" class="detail" text-anchor="start">Finished</text>
<path d="M 182 420 L 182 470" class="line"/>
<path d="M 480 420 L 480 470" class="line"/>
<path d="M 778 420 L 778 470" class="line"/>
<rect x="42" y="470" width="280" height="100" rx="8" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="182" y="504" class="heading" text-anchor="middle">Succeeded</text>
<text x="182" y="530" class="label" text-anchor="middle">Requested state or</text>
<text x="182" y="553" class="label" text-anchor="middle">reset observed</text>
<rect x="340" y="470" width="280" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="504" class="heading" text-anchor="middle">Failed</text>
<text x="480" y="530" class="label" text-anchor="middle">Nothing sent, or the</text>
<text x="480" y="553" class="label" text-anchor="middle">BMC refused it</text>
<rect x="638" y="470" width="280" height="100" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="778" y="504" class="heading" text-anchor="middle">Unknown</text>
<text x="778" y="530" class="label" text-anchor="middle">Maybe sent;</text>
<text x="778" y="553" class="label" text-anchor="middle">outcome unproven</text>
<text x="480" y="630" class="detail" text-anchor="middle">The result is set once. Staff create a new operation to try again.</text>
</svg>
