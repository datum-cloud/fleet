<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850" role="img" aria-labelledby="title description">
  <title id="title">Durable admission before federated execution</title>
  <desc id="description">Fleet validates a consumer request, retains exclusive allocation and exact operation authority in the provider project, then publishes a handoff to federation. The selected cell executes only admitted work and reports evidence to the hub. Fleet verifies that evidence before projecting readiness. Unknown outcomes retain custody; release requires verified location and provider cleanup before reuse.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    .heading { font-size: 19px; font-weight: 700; }
    .detail { font-size: 17px; fill: #475569; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .evidence { stroke-dasharray: 6 4; }
    .life { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 5; }
  </style>
  <rect width="1080" height="850" fill="white"/>
  <rect x="15" y="20" width="180" height="65" rx="8" fill="#eff6ff" stroke="#93b4df"/>
  <text x="105" y="47" class="heading" text-anchor="middle">Consumer</text><text x="105" y="71" class="detail" text-anchor="middle">Project API</text>
  <rect x="230" y="20" width="180" height="65" rx="8" fill="#eff6ff" stroke="#93b4df"/>
  <text x="320" y="47" class="heading" text-anchor="middle">Fleet</text><text x="320" y="71" class="detail" text-anchor="middle">Coordinator</text>
  <rect x="445" y="20" width="180" height="65" rx="8" fill="#f0fdf4" stroke="#96bda1"/>
  <text x="535" y="47" class="heading" text-anchor="middle">Provider</text><text x="535" y="71" class="detail" text-anchor="middle">Protected custody</text>
  <rect x="660" y="20" width="180" height="65" rx="8" fill="#fff7ed" stroke="#d9ad77"/>
  <text x="750" y="47" class="heading" text-anchor="middle">Federation</text><text x="750" y="71" class="detail" text-anchor="middle">Hub API</text>
  <rect x="875" y="20" width="190" height="65" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="970" y="47" class="heading" text-anchor="middle">Selected cell</text><text x="970" y="71" class="detail" text-anchor="middle">Execution adapters</text>
  <path d="M 105 85 V 710 M 320 85 V 710 M 535 85 V 710 M 750 85 V 710 M 970 85 V 710" class="life"/>
  <text x="212" y="120" class="detail" text-anchor="middle">Observe request</text>
  <path d="M 105 135 H 320" class="line"/>
  <rect x="250" y="159" width="735" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="617" y="188" class="detail" text-anchor="middle">Validate caller, source use, entitlement, quota, and current prerequisites</text>
  <text x="450" y="237" class="detail" text-anchor="middle">Retain allocation + exact operation</text>
  <path d="M 320 252 H 535" class="line"/>
  <text x="427" y="287" class="detail" text-anchor="middle">Durable authority</text>
  <path d="M 535 302 H 320" class="line evidence"/>
  <text x="535" y="340" class="detail" text-anchor="middle">Publish admitted handoff; recover with same operation identity</text>
  <path d="M 320 355 H 750" class="line"/>
  <text x="860" y="393" class="detail" text-anchor="middle">Deliver to exact target</text>
  <path d="M 750 408 H 970" class="line"/>
  <rect x="630" y="432" width="420" height="63" rx="8" fill="#fff7ed" stroke="#d9ad77"/>
  <text x="840" y="458" class="detail" text-anchor="middle">Journal before effects; execute only admitted work.</text>
  <text x="840" y="482" class="detail" text-anchor="middle">Fence prior executors before takeover.</text>
  <text x="860" y="528" class="detail" text-anchor="middle">Report exact-work evidence</text>
  <path d="M 970 543 H 750" class="line evidence"/>
  <text x="535" y="580" class="detail" text-anchor="middle">Read results; verify target, revision, freshness, and required gates</text>
  <path d="M 750 595 H 320" class="line evidence"/>
  <text x="212" y="633" class="detail" text-anchor="middle">Project verified status</text>
  <path d="M 320 648 H 105" class="line evidence"/>
  <rect x="30" y="725" width="1020" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="540" y="755" class="heading" text-anchor="middle">Unknown outcomes keep reservations or quarantine capacity.</text>
  <text x="540" y="784" class="detail" text-anchor="middle">Release verifies location cleanup, then required provider cleanup and quota settlement before reuse.</text>
  <text x="540" y="810" class="detail" text-anchor="middle">Proposed sequence · delivery is not execution success · dashed arrows carry results</text>
</svg>
