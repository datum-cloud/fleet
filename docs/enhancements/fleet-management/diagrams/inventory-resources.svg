<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title description">
  <title id="title">Physical inventory and offered capacity</title>
  <desc id="description">In the Service Provider Project, Rack references Facility, which references geographic Location. DeviceClaim reserves planned placement and binds one registered Device. Cable owns expected physical connections and PowerFeed describes supply dependencies. Verified inventory is a prerequisite for separate provider preparation and Metal capacity eligibility, not permission to allocate or execute effects.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    .heading { font-size: 23px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .detail { font-size: 17px; fill: #475569; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="740" fill="white"/>
  <rect x="20" y="20" width="920" height="610" rx="10" fill="#f0fdf4" stroke="#96bda1"/>
  <text x="44" y="55" class="heading">Service Provider Project</text>
  <text x="44" y="81" class="detail">Canonical physical inventory · fleet.datumapis.com · proposed</text>
  <rect x="50" y="110" width="220" height="76" rx="8" fill="white" stroke="#94a3b8"/>
  <text x="160" y="141" class="label" text-anchor="middle">Rack</text>
  <text x="160" y="166" class="detail" text-anchor="middle">Mounting constraints</text>
  <rect x="370" y="110" width="220" height="76" rx="8" fill="white" stroke="#94a3b8"/>
  <text x="480" y="141" class="label" text-anchor="middle">Facility</text>
  <text x="480" y="166" class="detail" text-anchor="middle">Physical premises</text>
  <rect x="690" y="110" width="220" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="800" y="141" class="label" text-anchor="middle">Location reference</text>
  <text x="800" y="166" class="detail" text-anchor="middle">Geography owner</text>
  <path d="M 270 148 L 370 148" class="line"/>
  <path d="M 590 148 L 690 148" class="line"/>
  <rect x="50" y="275" width="220" height="90" rx="8" fill="white" stroke="#94a3b8"/>
  <text x="160" y="308" class="label" text-anchor="middle">DeviceClaim</text>
  <text x="160" y="336" class="detail" text-anchor="middle">Approved installation</text>
  <path d="M 160 275 L 160 186" class="line"/>
  <text x="176" y="222" class="detail">Reserves</text>
  <text x="176" y="245" class="detail">placement</text>
  <rect x="370" y="275" width="220" height="90" rx="8" fill="white" stroke="#94a3b8"/>
  <text x="480" y="308" class="label" text-anchor="middle">Device</text>
  <text x="480" y="336" class="detail" text-anchor="middle">Actual asset + ports</text>
  <path d="M 270 320 L 370 320" class="line"/>
  <text x="320" y="300" class="detail" text-anchor="middle">Binds one</text>
  <rect x="690" y="245" width="220" height="70" rx="8" fill="white" stroke="#94a3b8"/>
  <text x="800" y="274" class="label" text-anchor="middle">Cable</text>
  <text x="800" y="298" class="detail" text-anchor="middle">Typed endpoint plan</text>
  <rect x="690" y="365" width="220" height="70" rx="8" fill="white" stroke="#94a3b8"/>
  <text x="800" y="394" class="label" text-anchor="middle">PowerFeed</text>
  <text x="800" y="418" class="detail" text-anchor="middle">Supply + dependencies</text>
  <path d="M 690 280 L 630 280 L 630 320 L 590 320" class="line"/>
  <path d="M 800 315 L 800 365" class="line"/>
  <text x="784" y="346" class="detail" text-anchor="end">Feed termination</text>
  <rect x="50" y="480" width="860" height="120" rx="8" fill="#eff6ff" stroke="#93b4df"/>
  <text x="480" y="514" class="label" text-anchor="middle">MachineCapacity · metal.datumapis.com</text>
  <text x="480" y="545" class="detail" text-anchor="middle">Owned supply retains an immutable Device reference.</text>
  <text x="480" y="574" class="detail" text-anchor="middle">Verification, preparation, and allocation eligibility are separate gates.</text>
  <path d="M 480 480 L 480 365" class="line"/>
  <text x="496" y="414" class="detail">deviceRef</text>
  <text x="480" y="670" class="detail" text-anchor="middle">Facility-only placement is allowed; unknown racks are not fabricated.</text>
  <text x="480" y="700" class="detail" text-anchor="middle">Cable endpoints may reference claim ports, Device components, or a typed PowerFeed.</text>
</svg>
