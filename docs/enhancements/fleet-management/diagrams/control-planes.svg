<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title description">
  <title id="title">Project ownership and Fleet control-plane boundaries</title>
  <desc id="description">Provider and consumer projects retain canonical resources. Fleet reads intent, retains provider-side authority, and projects status. Fleet submits admitted handoffs to the federation hub, which delivers only to the selected location. The cell reports evidence directly to the hub. Project APIs are not execution cells, and federation grants no allocation authority.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    .heading { font-size: 22px; font-weight: 700; }
    .detail { font-size: 17px; fill: #475569; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .evidence { stroke-dasharray: 6 4; }
  </style>
  <rect width="960" height="840" fill="white"/>
  <rect x="30" y="20" width="420" height="150" rx="10" fill="#f0fdf4" stroke="#96bda1"/>
  <text x="240" y="55" class="heading" text-anchor="middle">Service Provider Project</text>
  <text x="240" y="88" class="detail" text-anchor="middle">Inventory, offerings, supply</text>
  <text x="240" y="116" class="detail" text-anchor="middle">Protected allocation and operation custody</text>
  <text x="240" y="144" class="detail" text-anchor="middle">Provider intent / service-owned bindings</text>
  <rect x="510" y="20" width="420" height="150" rx="10" fill="#eff6ff" stroke="#93b4df"/>
  <text x="720" y="55" class="heading" text-anchor="middle">Consumer Project</text>
  <text x="720" y="88" class="detail" text-anchor="middle">Published references, permitted profiles</text>
  <text x="720" y="116" class="detail" text-anchor="middle">Machine and Installation requests</text>
  <text x="720" y="144" class="detail" text-anchor="middle">Consumer-owned network intent</text>
  <rect x="30" y="270" width="900" height="145" rx="10" fill="#eff6ff" stroke="#93b4df"/>
  <text x="480" y="305" class="heading" text-anchor="middle">Fleet control plane</text>
  <text x="480" y="338" class="detail" text-anchor="middle">Inventory verification · publication · shared lifecycle coordinator</text>
  <text x="480" y="367" class="detail" text-anchor="middle">Check caller, IAM, entitlement, quota, and evidence before admission.</text>
  <text x="480" y="395" class="detail" text-anchor="middle">Independent management runtime; project authority stays in project APIs.</text>
  <path d="M 170 270 L 170 170" class="line"/>
  <text x="155" y="210" class="detail" text-anchor="end">Retain</text>
  <text x="155" y="235" class="detail" text-anchor="end">authority</text>
  <path d="M 310 170 L 310 270" class="line"/>
  <text x="325" y="222" class="detail">Read inventory</text>
  <path d="M 650 170 L 650 270" class="line"/>
  <text x="635" y="222" class="detail" text-anchor="end">Read intent</text>
  <path d="M 790 270 L 790 170" class="line evidence"/>
  <text x="805" y="210" class="detail">Project</text>
  <text x="805" y="235" class="detail">status</text>
  <rect x="30" y="510" width="900" height="100" rx="10" fill="#fff7ed" stroke="#d9ad77"/>
  <text x="480" y="548" class="heading" text-anchor="middle">Federation Control Plane · Karmada hub</text>
  <text x="480" y="582" class="detail" text-anchor="middle">Canonical coordination handoff + explicit target policy; not an allocator</text>
  <path d="M 240 415 L 240 510" class="line"/>
  <text x="255" y="468" class="detail">Admitted intent</text>
  <path d="M 720 510 L 720 415" class="line evidence"/>
  <text x="705" y="468" class="detail" text-anchor="end">Execution results</text>
  <rect x="30" y="700" width="900" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="480" y="737" class="heading" text-anchor="middle">Selected location / cell control plane</text>
  <text x="480" y="771" class="detail" text-anchor="middle">Networking-owner integration · qualified executors · private credentials</text>
  <path d="M 240 610 L 240 700" class="line"/>
  <text x="255" y="660" class="detail">Targeted delivery</text>
  <path d="M 720 700 L 720 610" class="line evidence"/>
  <text x="705" y="660" class="detail" text-anchor="end">Direct execution status</text>
  <text x="480" y="826" class="detail" text-anchor="middle">Proposed topology · dashed arrows carry results, never new effect authority</text>
</svg>
