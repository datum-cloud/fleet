<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
<title id="title">Image and bootstrap data flow from the provider and the customer to the site</title><desc id="description">In the provider project, the provider defines a MachineImage by digest and publishes it to a consumer project. In the consumer project, the customer creates an Installation that names the published MachineImage and a bootstrap Secret. The Fleet provider for Metal resolves the image to its digest, copies the bootstrap data into a SealedPayload, and creates a DeviceInstallation that carries the digest and the sealed reference. The coordinator admits it and delivers the operation and the payload to the site. The site worker fetches the image artifacts by digest from the site's content-addressed store, which mirrors the provider's artifact registry, and boots the server with the image and the payload.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 22px; font-weight: 700; } .label { font-size: 19px; font-weight: 700; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
