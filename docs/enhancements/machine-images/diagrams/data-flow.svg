<text x="870" y="115" class="label" text-anchor="middle">Artifact store</text>
<text x="870" y="140" class="detail" text-anchor="middle">By digest</text>
<rect x="780" y="215" width="180" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="870" y="245" class="label" text-anchor="middle">Worker</text>
<text x="870" y="270" class="detail" text-anchor="middle">One operation</text>
<rect x="780" y="345" width="180" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="870" y="375" class="label" text-anchor="middle">Server</text>
<text x="870" y="400" class="detail" text-anchor="middle">One-time boot</text>
