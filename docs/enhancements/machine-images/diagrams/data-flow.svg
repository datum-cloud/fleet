<text x="145" y="115" class="label" text-anchor="middle">MachineImage</text>
<text x="145" y="140" class="detail" text-anchor="middle">Published copy</text>
<rect x="40" y="215" width="210" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="145" y="245" class="label" text-anchor="middle">Installation</text>
<text x="145" y="270" class="detail" text-anchor="middle">Image and Secret</text>
<rect x="40" y="345" width="210" height="75" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="145" y="375" class="label" text-anchor="middle">Bootstrap Secret</text>
<text x="145" y="400" class="detail" text-anchor="middle">User data, SSH keys</text>
<rect x="330" y="85" width="370" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="515" y="115" class="label" text-anchor="middle">MachineImage</text>
<text x="515" y="140" class="detail" text-anchor="middle">Immutable, by digest</text>
<rect x="330" y="215" width="370" height="75" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="515" y="245" class="label" text-anchor="middle">DeviceInstallation</text>
<text x="515" y="270" class="detail" text-anchor="middle">Digest, sealed reference</text>
<rect x="330" y="345" width="370" height="75" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="515" y="375" class="label" text-anchor="middle">SealedPayload</text>
<text x="515" y="400" class="detail" text-anchor="middle">Coordinator reads only</text>
