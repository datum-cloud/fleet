<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title description">
<title id="title">A registered server becomes allocatable</title><desc id="description">A registered server starts with Disabled capacity. Staff commission it under an approved plan. When the server passes commissioning, the projector derives Prepared and Healthy. A capacity operator enables the capacity with a cleaning policy and a pool label. The projector derives Available while custody is free, and the allocator claims custody to allocate it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .label { font-size: 19px; font-weight: 700; } .detail { font-size: 16px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="900" height="420" fill="white"/>
<rect x="30" y="60" width="200" height="80" rx="10" fill="#ffffff" stroke="#93b4df" stroke-width="1.5"/>
<text x="130" y="95" class="label" text-anchor="middle">Registered</text>
<text x="130" y="120" class="detail" text-anchor="middle">Capacity Disabled</text>
<rect x="330" y="60" width="200" height="80" rx="10" fill="#ffffff" stroke="#93b4df" stroke-width="1.5"/>
<text x="430" y="95" class="label" text-anchor="middle">Commissioned</text>
<text x="430" y="120" class="detail" text-anchor="middle">Plan ran, evidence kept</text>
<rect x="630" y="60" width="200" height="80" rx="10" fill="#ffffff" stroke="#93b4df" stroke-width="1.5"/>
<text x="730" y="95" class="label" text-anchor="middle">Prepared, Healthy</text>
<text x="730" y="120" class="detail" text-anchor="middle">Projector derives</text>
<rect x="630" y="280" width="200" height="80" rx="10" fill="#ffffff" stroke="#93b4df" stroke-width="1.5"/>
<text x="730" y="315" class="label" text-anchor="middle">Enabled</text>
<text x="730" y="340" class="detail" text-anchor="middle">Cleaning policy, pool</text>
<rect x="330" y="280" width="200" height="80" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="430" y="315" class="label" text-anchor="middle">Available</text>
<text x="430" y="340" class="detail" text-anchor="middle">Custody free</text>
<rect x="30" y="280" width="200" height="80" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="130" y="315" class="label" text-anchor="middle">Allocated</text>
<text x="130" y="340" class="detail" text-anchor="middle">Custody claimed</text>
<path d="M 230 100 H 330" class="line"/>
<text x="280" y="88" class="detail" text-anchor="middle">Commission</text>
<path d="M 530 100 H 630" class="line"/>
<text x="580" y="88" class="detail" text-anchor="middle">Passes</text>
<path d="M 730 140 V 280" class="line"/>
<text x="718" y="215" class="detail" text-anchor="end">Capacity operator enables</text>
<path d="M 630 320 H 530" class="line"/>
<text x="580" y="308" class="detail" text-anchor="middle">Derives</text>
<path d="M 330 320 H 230" class="line"/>
<text x="280" y="308" class="detail" text-anchor="middle">Claims</text>
</svg>
