name: machine-management-e2e

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  virtual-bmc:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned tools
        run: |
          set -euxo pipefail
          tools_bin="${RUNNER_TEMP}/fleet-tools"
          mkdir -p "${tools_bin}"
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "${tools_bin}/kind"
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum -o /tmp/kind.sha256
          sed "s#kind-linux-amd64#${tools_bin}/kind#" /tmp/kind.sha256 | sha256sum -c -
          chmod 0755 "${tools_bin}/kind"
          curl -fsSL https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl -o "${tools_bin}/kubectl"
          curl -fsSL https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256 -o /tmp/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  ${tools_bin}/kubectl" | sha256sum -c -
          chmod 0755 "${tools_bin}/kubectl"
          helm_version=v3.17.3
          curl -fsSL "https://get.helm.sh/helm-${helm_version}-linux-amd64.tar.gz" -o /tmp/helm.tgz
          curl -fsSL "https://get.helm.sh/helm-${helm_version}-linux-amd64.tar.gz.sha256sum" -o /tmp/helm.sha256
          helm_sha=$(awk '{print $1}' /tmp/helm.sha256)
          echo "${helm_sha}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          install -m 0755 /tmp/linux-amd64/helm "${tools_bin}/helm"
          GOBIN="${tools_bin}" go install github.com/go-task/task/v3/cmd/task@v3.41.0
          echo "${tools_bin}" >>"${GITHUB_PATH}"
          "${tools_bin}/kind" version
          "${tools_bin}/kubectl" version --client
          "${tools_bin}/helm" version
          "${tools_bin}/task" --version
      - name: Portable tests
        run: task test
      - name: Start virtual-BMC environment
        run: task e2e:up
      - name: End-to-end scenarios
        run: |
          set -o pipefail
          task e2e:test 2>&1 | tee .e2e/e2e-test.log
      - name: Collect diagnostics
        if: failure()
        run: |
          task e2e:diagnostics || true
          if [[ -f .e2e/e2e-test.log ]]; then
            tail -n 100 .e2e/e2e-test.log
            {
              tail -n 20 .e2e/e2e-test.log
              if [[ -f .e2e/proxy.log ]]; then
                echo "proxy log:"
                tail -n 20 .e2e/proxy.log
              fi
            } >"${RUNNER_TEMP}/fleet-e2e-error.txt"
            message=$(tr '\n' ' ' <"${RUNNER_TEMP}/fleet-e2e-error.txt" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=E2E failure::${message}"
          fi
      - name: Upload diagnostics and validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-machine-management-evidence
          path: |
            .e2e/diagnostics
            .e2e/validators
            .e2e/virtual-bmc/evidence
            .e2e/*.log
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: task e2e:down
