name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# The checks run as parallel jobs, so wall time is the slowest job rather than
# their sum. Each job restores its own Go build cache: the race-instrumented
# test builds and the plain vet and tool builds never share compiled packages,
# so one shared cache would hold only whichever job saved first. A cache key
# changes with go.sum; a miss restores the newest older cache for the job.
jobs:
  # Every Go test runs once, with the race detector. No package is excluded
  # from race runs by a build tag. The shards partition `go list ./...`: the
  # last shard takes every package the others do not name, so a new package
  # is always tested. -count=1 keeps a restored cache from replaying results.
  go-test:
    name: go-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [custody, api, rest]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with: {go-version-file: go.mod, cache: false}
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: go-test-${{ matrix.shard }}-${{ runner.os }}-
    - uses: actions/cache@v6
      with:
        path: ~/.local/share/kubebuilder-envtest
        key: envtest-${{ runner.os }}-v0.25.2-1.37.0
    # Runs the envtest-based tests against real API servers; without these
    # assets they skip, so a missing directory fails the job.
    - name: Install envtest assets
      run: |
        assets=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2 use 1.37.0 -p path)
        test -x "$assets/kube-apiserver" && test -x "$assets/etcd"
        echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
    - name: go test -race (${{ matrix.shard }})
      env:
        SHARD: ${{ matrix.shard }}
      run: |
        module=$(go list -m)
        all=$(go list ./...)
        case "$SHARD" in
          custody) packages=$(grep -x "$module/internal/custody" <<<"$all") ;;
          api) packages=$(grep "^$module/internal/api/" <<<"$all") ;;
          rest) packages=$(grep -vx -e "$module/internal/custody" -e "$module/internal/api/.*" <<<"$all") ;;
        esac
        [ -n "$packages" ] || { echo "shard $SHARD has no packages"; exit 1; }
        # shellcheck disable=SC2086
        go test -race -count=1 $packages
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with: {go-version-file: go.mod, cache: false}
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-checks-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: go-checks-${{ runner.os }}-
    - uses: imranismail/setup-kustomize@v2
      with: {kustomize-version: 5.8.1}
    - run: go vet ./...
    - run: go run ./test/acceptance/milo/cmd validate --root .
    - run: kustomize build config/base/crd >/dev/null
    - run: kustomize build config/milo >/dev/null
    - run: kustomize build config/milo-synthetic >/dev/null
    - run: kustomize build config/overlays/management-plane >/dev/null
    - run: kustomize build config/overlays/synthetic-staging >/dev/null
    - run: kustomize build config/inventory >/dev/null
    - run: ./hack/validate-synthetic-staging-render.sh
    - run: ./hack/validate-overlay-isolation.sh
    - run: ./hack/test-overlay-isolation.sh
    - run: ./hack/validate-standalone-render.sh
    - run: ./hack/test-standalone-source-id.sh
    - run: ./hack/test-standalone-preflight.sh
    - run: ./hack/test-standalone-build-context.sh
  # Script self-tests, shell lint and documentation links. None of them builds
  # Go code.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: imranismail/setup-kustomize@v2
      with: {kustomize-version: 5.8.1}
    - name: Install ripgrep for the link check
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep
    - run: ./hack/test-run-standalone-smoke.sh
    - run: ./hack/validate-doc-links.sh
    - run: ./hack/multiplane/test-harness.sh
    - run: shellcheck -S warning hack/multiplane/*.sh hack/local-vm/run.sh hack/local-vm/start-libvirt hack/local-vm/site-runtime
  standalone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with: {go-version-file: go.mod, cache: true}
    - uses: imranismail/setup-kustomize@v2
      with: {kustomize-version: 5.8.1}
    - name: Install pinned kind and kubectl
      shell: bash
      run: |
        set -euo pipefail
        go install sigs.k8s.io/kind@v0.31.0
        directory=$(mktemp -d)
        trap 'rm -rf "$directory"' EXIT
        cd "$directory"
        curl --fail --location --retry 3 --max-time 60 -o kubectl https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
        curl --fail --location --retry 3 --max-time 60 -o kubectl.sha256 https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
        echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
        chmod +x kubectl
        mkdir -p "$HOME/.local/bin"
        mv kubectl "$HOME/.local/bin/kubectl"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Run disposable standalone smoke
      run: ./hack/run-standalone-smoke.sh
