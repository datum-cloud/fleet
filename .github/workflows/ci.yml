name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with: {go-version-file: go.mod, cache: true}
    - uses: imranismail/setup-kustomize@v2
      with: {kustomize-version: 5.8.1}
    - name: Verify session and coordination CRD generation
      run: |
        go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.23.0 crd paths="./internal/api/session/...;./internal/api/coordination/..." output:crd:artifacts:config=config/crd/bases
        git diff --exit-code -- config/crd/bases
    - run: kustomize build config/crd >/dev/null
    - run: kustomize build config/federation >/dev/null
    - run: kustomize build config/manager >/dev/null
    - run: kustomize build config/location >/dev/null
    - run: go test ./...
    - run: go test -race ./...
    - run: go vet ./...
    - run: go run ./test/acceptance/milo/cmd validate --root .
    - run: kustomize build config/base/crd >/dev/null
    - run: kustomize build config/milo >/dev/null
    - run: kustomize build config/overlays/management-plane >/dev/null
    - run: kustomize build config/overlays/synthetic-staging >/dev/null
    - run: ./hack/validate-synthetic-staging-render.sh
    - run: ./hack/validate-overlay-isolation.sh
    - run: ./hack/test-overlay-isolation.sh
    - run: ./hack/validate-standalone-render.sh
    - run: ./hack/test-standalone-source-id.sh
    - run: ./hack/test-standalone-preflight.sh
    - run: ./hack/test-standalone-build-context.sh
    - run: ./hack/validate-doc-links.sh
